implementation_choices:
  - id: IC001
    topic: Internal angle representation
    statement: The source defines SVG `skewX` input values as numbers interpreted as degrees, but does not require a particular internal representation.
    allowed_by:
      - css-transforms-svg-functions
    source_refs:
      - css-transforms-svg-functions
ambiguities:
  - id: A001
    question: The CSS Transforms published text appears to label the `skewX` grammar production with `skewY` in the extracted source text.
    impact: Implementations still need a `skewX` one-number parser because the transform production includes `skewX` and the function mapping table defines `skewX`.
    options:
      - Treat the extracted duplicate `skewY` label as an editorial extraction issue and use the mapping table for `skewX`.
    source_refs:
      - css-transforms-svg-transform-syntax
      - css-transforms-svg-functions
dependencies:
