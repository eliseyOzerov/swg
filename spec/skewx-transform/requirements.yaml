schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: skewx-transform
  title: SVG skewX transform function
  domain: SVG 2 / CSS Transforms Level 1
  profile: null
  summary: The SVG `skewX` transform function skews local coordinates along the x-axis by an angle interpreted from a unitless SVG number as degrees.
  non_goals:
    - `skewY`.
    - CSS `skew()`.
    - Transform-list ordering.
    - 3D transform functions.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-coords-transform-property
      title: SVG 2, 8.5 The transform property
      url: https://www.w3.org/TR/SVG2/coords.html#TransformProperty
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: css-transforms-svg-transform-syntax
      title: CSS Transforms Module Level 1, 7.2 Syntax of the SVG transform attribute
      url: https://www.w3.org/TR/css-transforms-1/#svg-transform
      version: Candidate Recommendation 14 February 2019
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: css-transforms-svg-functions
      title: CSS Transforms Module Level 1, 7.3 SVG transform functions
      url: https://www.w3.org/TR/css-transforms-1/#svg-transform-functions
      version: Candidate Recommendation 14 February 2019
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: css-transforms-mathematical-description
      title: CSS Transforms Module Level 1, 14 Mathematical Description of Transform Functions
      url: https://www.w3.org/TR/css-transforms-1/#mathematical-description
      version: Candidate Recommendation 14 February 2019
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes:
    - SVG 2 requires support for the transform property and presentation attribute as defined by CSS Transforms Level 1.
    - CSS Transforms states that `skew()` is not supported by SVG transform attributes, while `skewX` is part of the SVG transform grammar.

scope:
  includes:
    - Parsing valid one-argument `skewX` transform functions in SVG transform attributes.
    - Interpreting unitless SVG `skewX` numbers as degree angles.
    - Applying the x-axis skew transform to points.
  excludes:
    - `skewY`.
    - CSS `skew()`.
    - Malformed skew argument recovery.
  assumptions:
    - The package stores transform angles internally in radians.

terminology:
  - id: term-skewx-transform
    term: skewX transform
    definition: A transform function that skews coordinates along the x-axis by the given angle.
    source_refs:
      - css-transforms-svg-functions
      - css-transforms-mathematical-description

structures:
  - id: S001
    name: skewX(angle)
    kind: transform-function
    source_refs:
      - css-transforms-svg-transform-syntax
      - css-transforms-svg-functions
    fields:
      - name: angle
        type: number
        cardinality: required
        position: 1
        constraints:
          - Unitless SVG `skewX` values are interpreted as CSS angle values in degrees.
        requirement_refs:
          - R002
          - R003
        source_refs:
          - css-transforms-svg-transform-syntax
          - css-transforms-svg-functions

requirements:
  - id: R001
    normative_strength: MUST
    kind: conformance
    statement: SVG user agents must support the transform property and presentation attribute as defined by CSS Transforms Level 1.
    applies_to:
      - SVGParser.parseTransform
    source_refs:
      - svg2-coords-transform-property
    testability: reviewable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: structure
    statement: The SVG transform attribute `skewX` function must accept one number argument.
    applies_to:
      - SVGParser.parseTransform
    source_refs:
      - css-transforms-svg-transform-syntax
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: The SVG `skewX` number argument must be interpreted as a CSS angle value in degrees.
    applies_to:
      - SVGAngleParser
      - SVGParser.parseTransform
    source_refs:
      - css-transforms-svg-functions
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: A `skewX` transform must skew the x coordinate by the y coordinate multiplied by the tangent of the angle, while leaving the y coordinate unchanged.
    applies_to:
      - Transform
      - Point.applying
      - SVGParser.parseTransform
    source_refs:
      - css-transforms-mathematical-description
    testability: testable
    notes: []

algorithms:
  - id: ALG001
    name: Equivalent skewX matrix
    kind: algorithm
    summary: Compose the current transform with a 2D matrix whose x-skew coefficient is `tan(angle)`.
    steps:
      - Interpret the SVG number argument as degrees.
      - Convert the angle to the package's internal angular representation.
      - Set the x-skew matrix coefficient to `tan(angle)`.
      - Leave y coordinates unchanged.
    preconditions:
      - The SVG `skewX` function has exactly one valid number argument.
    postconditions:
      - A point `(x, y)` maps to `(x + tan(angle) * y, y)`.
    requirement_refs:
      - R003
      - R004
    source_refs:
      - css-transforms-svg-functions
      - css-transforms-mathematical-description

invalid_or_unsupported_inputs:
  - id: I001
    condition: A `skewX` transform with anything other than one valid number argument.
    source_behavior: UNSPECIFIED
    required_behavior: null
    decision_required: true
    source_refs:
      - css-transforms-svg-transform-syntax

recommendations: []
