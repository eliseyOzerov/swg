schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: rect-ry
  title: rect rounded corners with ry
  domain: SVG 2
  profile: null
  summary: >
    Capture SVG 2 parser-visible behavior for the rect ry geometry property
    when it defines rounded rectangle y-axis corner radii and derives rx from
    ry when rx is auto.
  non_goals:
    - Full rx-only behavior as an independently tested feature.
    - CSS geometry property cascade beyond XML attributes.
    - Percentage ry resolution.
    - DOM interface conformance.

source_context:
  spec_map: null
  map_items:
    - id: basic-shapes-rect-ry
      title: Basic Shapes - rect rounded corners with ry
      artifact_path: spec/rect-ry/requirements.yaml
  canonical_sources:
    - id: svg2-shapes-rect
      title: SVG 2 Basic Shapes - The rect element
      url: https://www.w3.org/TR/SVG2/shapes.html#RectElement
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes:
    - No project-local spec map exists yet, so this artifact is scoped directly to the TODO bullet.

scope:
  includes:
    - Parsing non-negative ry values on rect elements.
    - Treating negative ry values as invalid auto values.
    - Deriving rx from ry when ry is specified and rx is auto.
    - Clamping the derived used rx to at most half of the rectangle width.
    - Clamping used ry to at most half of the rectangle height.
    - Producing rounded-rectangle equivalent paths when both used radii are positive.
  excludes:
    - Testing rx-only derivation from rx to ry.
    - Percentage ry resolution.
    - CSS geometry property cascade.
    - Rendering backend behavior.
  assumptions:
    - >
      The package can represent omitted or invalid rx/ry values as auto flags in
      addition to the public numeric fallback values.
    - >
      The equivalent Path roundedRect command is an acceptable structured form
      for the SVG rounded-rect path algorithm.

terminology:
  - id: term-ry
    term: ry
    definition: >
      The y-axis radius used for elliptical arcs that round off rect corners.
    source_refs:
      - svg2-shapes-rect
  - id: term-auto-radius
    term: auto radius
    definition: >
      An omitted, auto, or invalid corner radius whose used value may be
      determined from the other corner radius.
    source_refs:
      - svg2-shapes-rect
  - id: term-used-radius
    term: used corner radius
    definition: >
      The absolute corner radius after resolving auto behavior and clamping so
      that straight rectangle segments are never negative.
    source_refs:
      - svg2-shapes-rect

structures:
  - id: S001
    name: rect ry geometry
    kind: structure
    source_refs:
      - svg2-shapes-rect
    fields:
      - name: ry
        type: length-percentage-or-auto
        cardinality: one
        position: geometry-property
        constraints:
          - Negative values are illegal and ignored as parsing errors.
          - If ry is specified and rx is auto, rx's absolute value is the same.
          - The used value is clamped to half the used rectangle height.
        requirement_refs:
          - R001
          - R002
          - R004
        source_refs:
          - svg2-shapes-rect
      - name: derivedRx
        type: length
        cardinality: zero-or-one
        position: used-value
        constraints:
          - Derived from ry when rx is auto.
          - The used value is clamped to half the used rectangle width.
        requirement_refs:
          - R002
          - R003
        source_refs:
          - svg2-shapes-rect

requirements:
  - id: R001
    normative_strength: MUST
    kind: error
    statement: >
      A negative ry value is illegal and must be ignored as a parsing error.
    applies_to:
      - rect ry
    source_refs:
      - svg2-shapes-rect
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: algorithm
    statement: >
      If ry is a length value and rx is auto, the absolute value for rx must be
      the same as the absolute value for ry.
    applies_to:
      - rect ry
      - rect rx
    source_refs:
      - svg2-shapes-rect
    testability: testable
    notes:
      - SVG 2 resolves ry percentages against height; this bullet covers unitless values.
  - id: R003
    normative_strength: MUST
    kind: algorithm
    statement: >
      If the derived absolute rx value is greater than half the used width, the
      used rx value must be half the used width.
    applies_to:
      - rect derived rx
    source_refs:
      - svg2-shapes-rect
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: algorithm
    statement: >
      If the absolute ry value is greater than half the used height, the used
      ry value must be half the used height.
    applies_to:
      - rect ry
    source_refs:
      - svg2-shapes-rect
    testability: testable
    notes: []
  - id: R005
    normative_strength: MUST
    kind: path
    statement: >
      A rounded rect with positive used rx and ry values must use elliptical arc
      segments in its equivalent path.
    applies_to:
      - rect equivalent path
    source_refs:
      - svg2-shapes-rect
    testability: testable
    notes: []

invalid_or_unsupported_inputs:
  - id: I001
    condition: Negative ry.
    source_behavior: MUST_NOT
    required_behavior: Ignore as a parsing error and treat as auto for used-radius computation.
    decision_required: false
    source_refs:
      - svg2-shapes-rect

recommendations: []

derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: >
      For this package, a positive ry with auto rx must produce a roundedRect
      Path command whose cornerWidth is the clamped derived rx and whose
      cornerHeight is the clamped used ry.
    derived_from:
      - R002
      - R003
      - R004
      - R005
    reasoning: >
      The package exposes equivalent geometry through Path commands; the
      roundedRect command records the same used radii required by SVG 2.
    source_refs:
      - svg2-shapes-rect

implementation_choices:
  - id: IC001
    topic: Auto radius representation
    statement: >
      The source defines auto as a computed value; the parser may preserve this
      as internal flags while exposing numeric fallback values for compatibility.
    allowed_by:
      - R002
    source_refs:
      - svg2-shapes-rect

ambiguities: []

dependencies:
  - id: DEP001
    kind: source-section
    title: SVG 2 Units
    reason: >
      Percentage ry resolution depends on SVG length and percentage unit rules.
    source_refs:
      - svg2-shapes-rect

