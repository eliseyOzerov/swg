  - id: DEP002
    kind: work-item
    title: Animation interpolation and addition attributes
    reason: "`calcMode`, `values`, `keyTimes`, `keySplines`, `additive`, and `accumulate` determine evaluation behavior after this element is recognized."
    source_refs:
