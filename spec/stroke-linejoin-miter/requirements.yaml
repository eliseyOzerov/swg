derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: A child element without its own `stroke-linejoin` declaration must expose `miter` when its inherited value is `miter`.
    derived_from:
      - R003
      - R004
    reasoning: Because `stroke-linejoin` is inherited and computed as specified, inherited parser state must preserve a `miter` value.
    source_refs:
      - svg2-stroke-linejoin-property

implementation_choices:
  - id: IC001
    topic: Parser representation
    statement: The package may represent SVG `miter` with its existing `LineJoin.miter` case.
    allowed_by:
