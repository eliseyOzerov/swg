implementation_choices:
  - id: IC001
    topic: Parser representation
    statement: The package may represent SVG `evenodd` with its existing `FillRule.evenOdd` case.
    allowed_by:
      - The source defines behavior and value semantics, not programming-language enum case names.
    source_refs:
