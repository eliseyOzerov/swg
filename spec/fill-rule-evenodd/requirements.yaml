ambiguities:
  - id: A001
    question: Should the package eventually expose a public spelling that exactly matches SVG `evenodd` instead of Swift-style `evenOdd`?
    impact: API naming may matter for users who expect SVG terminology, but this bullet can verify behavior through the existing representation.
    options:
      - Keep `FillRule.evenOdd` as the even-odd representation.
      - Add an alias or rename in a future API cleanup.
    source_refs:
