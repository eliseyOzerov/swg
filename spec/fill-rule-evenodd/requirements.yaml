      - svg2-fill-rule-property
    testability: testable
    notes: []

algorithms:
  - id: ALG001
    name: Even-odd inside test
    kind: algorithm
    summary: A point is inside under `evenodd` when an arbitrary ray from that point crosses an odd number of path segments.
    steps:
      - Draw a ray from the tested point to infinity in any direction.
      - Count each path segment crossing the ray.
      - Treat the point as outside when the total count is even.
      - Treat the point as inside when the total count is odd.
    preconditions:
      - The shape has path segments that can be tested against a ray.
    postconditions:
      - The result classifies the tested point as inside or outside for fill painting.
    requirement_refs:
      - R004
    source_refs:
      - svg2-fill-rule-property

invalid_or_unsupported_inputs:
  - id: I001
    condition: A `fill-rule` value is neither `nonzero` nor `evenodd`.
    source_behavior: UNSPECIFIED
    required_behavior: Invalid CSS property values do not produce a valid specified value; this parser work item must leave the current inherited or default value unchanged.
    decision_required: false
    source_refs:
      - svg2-fill-rule-property

