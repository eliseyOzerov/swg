      - SVG text content elements
    source_refs:
      - svg2-fill-rule-property
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: "`fill-rule` must inherit from parent elements."
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-fill-rule-property
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: "The computed value for `fill-rule: evenodd` must remain `evenodd`."
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-fill-rule-property
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: Fill painting must use the current `fill-rule` value to decide which portions of a shape are inside.
    applies_to:
      - SVG fill painting
    source_refs:
      - svg2-fill-property
      - svg2-fill-rule-property
