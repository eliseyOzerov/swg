derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: A child element without its own `fill-rule` declaration must expose `evenodd` when its inherited value is `evenodd`.
    derived_from:
      - R002
      - R003
    reasoning: Because `fill-rule` is inherited and computed as specified, inherited parser state must preserve an `evenodd` value.
    source_refs:
