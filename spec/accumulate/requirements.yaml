schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: accumulate
  title: SVG accumulate animation attribute
  domain: SVG Animation
  profile: null
  summary: Requirements for preserving the SVG `accumulate` animation addition attribute on parsed value animation element data.
  non_goals:
    - Applying cumulative animation during rendering, interpolation, or repeat evaluation.
    - Implementing `additive`, covered by the previous checklist bullet.
    - Deciding whether the target animated value supports addition.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg-animations-addition-attributes
      title: SVG Animations Level 2, Attributes that control whether animations are additive
      url: https://svgwg.org/specs/animations/#AdditionAttributes
      version: W3C Editor's Draft 14 September 2025
      publisher: W3C SVG Working Group
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - The SVG Animations draft delegates detailed cumulative processing to SMIL Animation except where SVG-specific rules are stated.

scope:
  includes:
    - "`accumulate` preservation for recognized values `none` and `sum`."
    - "`accumulate` default value `none` when omitted."
    - Raw unresolved preservation for malformed `accumulate` tokens.
    - Removal of parsed `accumulate` from `animate`, `animateMotion`, and `animateTransform` unknown attributes.
  excludes:
    - Runtime cumulative behavior across repeat iterations.
    - Ignoring accumulate for unsupported target value addition, non-repeating animation elements, or to-animation.
    - "`set`, whose element definition says additive and accumulate attributes are not allowed and ignored if specified."
  assumptions:
    - Parser output may expose accumulate mode separately from runtime validation rules.

terminology:
  - id: term-accumulate
    term: accumulate
    definition: Attribute that controls whether repeat iterations build upon the previous iteration value.
    source_refs:
      - svg-animations-addition-attributes

requirements:
  - id: R001
    normative_strength: MUST
    kind: behavior
    statement: "`accumulate` must preserve recognized values `none` and `sum` when specified."
    applies_to:
      - accumulate
      - animate
      - animateMotion
      - animateTransform
    source_refs:
      - svg-animations-addition-attributes
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: "`accumulate` must default to `none` when omitted."
    applies_to:
      - accumulate
    source_refs:
      - svg-animations-addition-attributes
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: Parsed `accumulate` must not be reported as an unknown attribute on `animate`, `animateMotion`, or `animateTransform` data.
    applies_to:
      - unknownAttributes
    source_refs:
      - svg-animations-addition-attributes
    testability: testable
    notes: []

invalid_or_unsupported_inputs:
  - id: I001
    condition: An `accumulate` token other than `none` or `sum`.
    source_behavior: invalid for accumulate.
    required_behavior: Preserve the raw token as unresolved parser addition data.
    decision_required: false
    source_refs:
      - svg-animations-addition-attributes

traceability:
  - item_id: R001
    item_type: requirement
    source_refs:
      - svg-animations-addition-attributes
    map_item_refs: []
  - item_id: R002
    item_type: requirement
    source_refs:
      - svg-animations-addition-attributes
    map_item_refs: []
  - item_id: R003
    item_type: requirement
    source_refs:
      - svg-animations-addition-attributes
    map_item_refs: []
