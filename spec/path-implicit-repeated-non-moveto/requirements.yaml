  - id: R007
    normative_strength: MUST
    kind: grammar
    statement: >
      T/t smooth quadratic Bezier command data consumes a coordinate-pair
      sequence, so every coordinate pair is processed as a smooth quadratic
      Bezier segment.
    applies_to:
      - path data parser
    source_refs:
      - svg2-path-data-grammar
      - svg2-path-data-quadratic
    testability: testable
    notes: []
  - id: R008
    normative_strength: MUST
    kind: grammar
    statement: >
      A/a elliptical arc command data consumes an elliptical-arc argument
      sequence, so every complete elliptical-arc argument group is processed as
      an arc segment.
    applies_to:
      - path data parser
    source_refs:
      - svg2-path-data-grammar
      - svg2-path-data-arc
    testability: testable
    notes: []
  - id: R009
    normative_strength: MUST
    kind: state
    statement: >
      Repeated non-M argument groups are processed in order, and each generated
      segment updates the current point before the next repeated group is
      resolved.
    applies_to:
      - path current point
    source_refs:
      - svg2-path-data-grammar
      - svg2-path-data-lineto
      - svg2-path-data-cubic
      - svg2-path-data-quadratic
