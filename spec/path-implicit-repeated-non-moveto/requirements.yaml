derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: >
      For this package, repeated non-M argument groups must materialize as
      additional PathCommand values of the same semantic command family.
    derived_from:
      - R001
      - R002
      - R003
      - R004
      - R005
      - R006
      - R007
      - R008
      - R009
    reasoning: >
      PathCommand values are the package's inspectable path representation, so
      repeated grammar groups need to be expanded into separate commands after
      resolving relative coordinates and smooth-control state.
    source_refs:
      - svg2-path-data-grammar

implementation_choices:
  - id: IC001
    topic: Arc conversion
    statement: >
      This package may convert a single repeated elliptical-arc argument group
      into one or more cubic PathCommand values; this bullet only requires that
      each repeated arc group is consumed in sequence and reaches its endpoint.
    allowed_by:
      - R008
      - R009
    source_refs:
      - svg2-path-data-arc
      - svg2-path-data-grammar

