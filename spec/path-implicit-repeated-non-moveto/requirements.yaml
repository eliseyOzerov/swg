schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: path-implicit-repeated-non-moveto
  title: Implicit repeated non-moveto path commands
  domain: SVG 2
  profile: null
  summary: >
    Capture SVG 2 path data behavior for repeated argument groups after non-M
    drawing commands, where each additional group is processed as another
    command of the same type.
  non_goals:
    - Repeated coordinate pairs after M/m moveto commands.
    - Compact number tokenization such as adjacent signs or decimal points.
    - Exponent tokenization.
    - Arc radius correction, flag-combination geometry, or degenerate arc behavior.
    - Path data error recovery for incomplete repeated groups.

source_context:
  spec_map: null
  map_items:
