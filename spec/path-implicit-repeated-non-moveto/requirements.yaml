    - No project-local spec map exists yet, so this artifact is scoped directly to the TODO bullet.

scope:
  includes:
    - Repeated coordinate pairs after L/l lineto.
    - Repeated coordinates after H/h horizontal lineto.
    - Repeated coordinates after V/v vertical lineto.
    - Repeated coordinate-pair triplets after C/c cubic Bezier curveto.
    - Repeated coordinate-pair doubles after S/s smooth cubic Bezier curveto.
    - Repeated coordinate-pair doubles after Q/q quadratic Bezier curveto.
    - Repeated coordinate pairs after T/t smooth quadratic Bezier curveto.
    - Repeated elliptical-arc argument groups after A/a.
  excludes:
    - M/m repeated coordinate-pair behavior.
    - Z/z closepath, which has no command arguments to repeat.
    - Numeric tokenizer edge cases that are tracked by separate TODO bullets.
    - Arc geometry details other than processing repeated argument groups in sequence.
  assumptions:
    - >
      The package stores all parsed path commands as resolved absolute
      PathCommand values.
    - >
      For arcs, the package converts each elliptical arc argument group into one
      or more cubic Bezier PathCommand values; tests observe each group's final
      endpoint rather than exact generated cubic control points.

terminology:
  - id: term-repeated-argument-group
    term: repeated argument group
    definition: >
      An additional grammar production instance following the same command
      letter and processed as another command of that type.
    source_refs:
      - svg2-path-data-grammar
  - id: term-coordinate-pair-sequence
    term: coordinate_pair_sequence
    definition: >
      A recursive grammar production containing one or more coordinate pairs.
    source_refs:
      - svg2-path-data-grammar
  - id: term-elliptical-arc-argument-sequence
    term: elliptical_arc_argument_sequence
    definition: >
      A recursive grammar production containing one or more elliptical arc
      argument groups.
    source_refs:
      - svg2-path-data-grammar

structures:
  - id: S001
    name: Repeating non-M command argument sequences
    kind: structure
    source_refs:
      - svg2-path-data-grammar
    fields:
      - name: lineto
        type: coordinate_pair_sequence
        cardinality: one-or-more
        position: after L/l
        constraints:
          - Each coordinate pair creates one lineto segment.
        requirement_refs:
          - R001
        source_refs:
          - svg2-path-data-grammar
          - svg2-path-data-lineto
      - name: horizontalLineto
        type: coordinate_sequence
        cardinality: one-or-more
        position: after H/h
        constraints:
          - Each coordinate creates one horizontal lineto segment.
        requirement_refs:
          - R002
        source_refs:
          - svg2-path-data-grammar
          - svg2-path-data-lineto
      - name: verticalLineto
        type: coordinate_sequence
        cardinality: one-or-more
        position: after V/v
        constraints:
          - Each coordinate creates one vertical lineto segment.
        requirement_refs:
          - R003
        source_refs:
          - svg2-path-data-grammar
          - svg2-path-data-lineto
      - name: cubicCurveto
        type: curveto_coordinate_sequence
        cardinality: one-or-more
        position: after C/c
        constraints:
          - Each coordinate-pair triplet creates one cubic Bezier segment.
        requirement_refs:
          - R004
        source_refs:
          - svg2-path-data-grammar
          - svg2-path-data-cubic
      - name: smoothCubicCurveto
        type: smooth_curveto_coordinate_sequence
        cardinality: one-or-more
        position: after S/s
        constraints:
          - Each coordinate-pair double creates one smooth cubic Bezier segment.
        requirement_refs:
          - R005
        source_refs:
          - svg2-path-data-grammar
          - svg2-path-data-cubic
      - name: quadraticCurveto
        type: quadratic_bezier_curveto_coordinate_sequence
        cardinality: one-or-more
        position: after Q/q
        constraints:
          - Each coordinate-pair double creates one quadratic Bezier segment.
        requirement_refs:
          - R006
        source_refs:
          - svg2-path-data-grammar
          - svg2-path-data-quadratic
      - name: smoothQuadraticCurveto
        type: coordinate_pair_sequence
        cardinality: one-or-more
        position: after T/t
        constraints:
          - Each coordinate pair creates one smooth quadratic Bezier segment.
        requirement_refs:
          - R007
        source_refs:
          - svg2-path-data-grammar
          - svg2-path-data-quadratic
      - name: ellipticalArc
        type: elliptical_arc_argument_sequence
        cardinality: one-or-more
        position: after A/a
        constraints:
          - Each elliptical arc argument group creates one arc segment before conversion or rendering.
        requirement_refs:
          - R008
        source_refs:
          - svg2-path-data-grammar
          - svg2-path-data-arc

requirements:
  - id: R001
    normative_strength: MUST
    kind: grammar
    statement: >
      L/l lineto command data consumes a coordinate-pair sequence, so every
      coordinate pair in the sequence is processed as a lineto segment.
    applies_to:
      - path data parser
    source_refs:
      - svg2-path-data-grammar
      - svg2-path-data-lineto
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: grammar
    statement: >
      H/h horizontal lineto command data consumes a coordinate sequence, so
      every coordinate in the sequence is processed as a horizontal lineto
      segment.
    applies_to:
      - path data parser
    source_refs:
      - svg2-path-data-grammar
      - svg2-path-data-lineto
    testability: testable
    notes: []
