implementation_choices:
  - id: IC001
    topic: Attribute key form
    statement: Preserved attributes keep the qualified name strings delivered by Foundation XMLParser until namespace-aware attribute modeling is introduced.
    allowed_by:
      - Current parser architecture
    source_refs:
      - xml10-start-tags
