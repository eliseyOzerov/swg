  - id: I001
    condition: A `stroke-linecap` value is not `butt`, `round`, or `square`.
    source_behavior: UNSPECIFIED
    required_behavior: Invalid CSS property values do not produce a valid specified value; this parser work item must leave the current inherited or default value unchanged.
    decision_required: false
    source_refs:
      - svg2-stroke-linecap-property

recommendations: []

derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: A child element without its own `stroke-linecap` declaration must expose `round` when its inherited value is `round`.
    derived_from:
      - R002
      - R003
    reasoning: Because `stroke-linecap` is inherited and computed as specified, inherited parser state must preserve a `round` value.
    source_refs:
      - svg2-stroke-linecap-property

implementation_choices:
  - id: IC001
    topic: Parser representation
    statement: The package may represent SVG `round` with its existing `LineCap.round` case.
    allowed_by:
      - The source defines behavior and value semantics, not programming-language enum case names.
    source_refs:
      - svg2-stroke-linecap-property

