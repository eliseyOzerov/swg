schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: patterncontentunits
  title: SVG patternContentUnits attribute
  domain: SVG 2
  profile: null
  summary: Preserve the coordinate-system selection for SVG pattern child content using the `patternContentUnits` attribute.
  non_goals:
    - Rendering pattern tiles.
    - Applying the coordinate-system transform to child geometry.
    - Resolving template inheritance through `href`.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-patterncontentunits
      title: "SVG 2 Paint Servers: patternContentUnits"
      url: https://www.w3.org/TR/SVG/pservers.html#PatternElementPatternContentUnitsAttribute
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - The attribute is part of the `<pattern>` element definition in SVG 2 Paint Servers.

scope:
  includes:
    - "`patternContentUnits=\"userSpaceOnUse\"`."
    - "`patternContentUnits=\"objectBoundingBox\"`."
    - Default `patternContentUnits` behavior.
    - The source rule that `patternContentUnits` has no effect when `viewBox` is specified.
  excludes:
    - Pattern rendering.
    - "`viewBox` transform application."
    - Template inheritance.
  assumptions:
    - The parser can preserve `patternContentUnits` even when `viewBox` is present; downstream rendering decides that the attribute has no effect in that case.

terminology:
  - id: T001
    term: patternContentUnits
    definition: The `<pattern>` attribute that selects the coordinate system for the pattern's child content when no pattern `viewBox` overrides it.
    source_refs:
      - svg2-patterncontentunits

structures:
  - id: S001
    name: Pattern content coordinate system
    kind: field
    source_refs:
      - svg2-patterncontentunits
    fields:
      - name: patternContentUnits
        type: enumeration
        cardinality: optional
        position: pattern-attribute
        constraints:
          - Allowed values are `userSpaceOnUse` and `objectBoundingBox`.
          - Initial value is `userSpaceOnUse`.
          - Has no effect if `viewBox` is specified on the pattern.
        requirement_refs:
          - R001
          - R002
          - R003
        source_refs:
          - svg2-patterncontentunits

requirements:
  - id: R001
    normative_strength: MUST
    kind: coordinate-system
    statement: "`patternContentUnits=\"userSpaceOnUse\"` must identify the current user coordinate system, after applying `patternTransform`, as the coordinate system for pattern child content."
    applies_to:
      - pattern.patternContentUnits
    source_refs:
      - svg2-patterncontentunits
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: coordinate-system
    statement: "`patternContentUnits=\"objectBoundingBox\"` must identify the referencing element's object bounding box coordinate system, after applying `patternTransform`, as the coordinate system for pattern child content."
    applies_to:
      - pattern.patternContentUnits
    source_refs:
      - svg2-patterncontentunits
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: default
    statement: The initial value of `patternContentUnits` is `userSpaceOnUse`.
    applies_to:
      - pattern.patternContentUnits
    source_refs:
      - svg2-patterncontentunits
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: override
    statement: The `patternContentUnits` attribute has no effect if the pattern element specifies `viewBox`.
    applies_to:
      - pattern.patternContentUnits
      - pattern.viewBox
    source_refs:
      - svg2-patterncontentunits
    testability: reviewable
    notes:
      - This work item preserves the attribute value and records the no-effect rule for rendering.

algorithms: []
invalid_or_unsupported_inputs: []
recommendations: []
derived_requirements: []
implementation_choices:
  - id: IC001
    topic: ViewBox no-effect handling
    statement: A data model may preserve `patternContentUnits` when `viewBox` exists, as long as rendering treats `viewBox` as overriding the content-units coordinate system.
    allowed_by:
      - R004
    source_refs:
      - svg2-patterncontentunits
ambiguities: []
dependencies:
  - id: DEP001
    kind: source-section
    title: SVG pattern element
    reason: "`patternContentUnits` is meaningful only as an attribute on `<pattern>`."
    source_refs:
      - svg2-patterncontentunits
  - id: DEP002
    kind: source-section
    title: SVG object bounding box units
    reason: Required to interpret the `objectBoundingBox` value.
    source_refs:
      - svg2-patterncontentunits
  - id: DEP003
    kind: source-section
    title: SVG transform-list
    reason: "`patternTransform` participates in the coordinate system described by both values."
    source_refs:
      - svg2-patterncontentunits

