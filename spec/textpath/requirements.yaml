implementation_choices:
  - id: IC001
    topic: Parser representation
    statement: A parser may preserve textPath as ordered text runs that carry textPath path-selection data and painting attributes for later rendering.
    allowed_by:
      - R001
      - R002
      - R003
    source_refs:
      - svg2-textpath

ambiguities: []

