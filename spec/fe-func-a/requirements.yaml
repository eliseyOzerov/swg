schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: fe-func-a
  title: SVG feFuncA transfer function element
  domain: SVG Filter Effects
  profile: null
  summary: Preserve SVG `<feFuncA>` transfer function elements as the alpha-channel function of an enclosing `<feComponentTransfer>` primitive.
  non_goals:
    - Parsing red, green, or blue channel transfer function elements.
    - Executing transfer-function remapping.
    - Supporting animation children.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: filter-effects-fe-func-a
      title: "Filter Effects Module Level 1: Transfer function feFuncA"
      url: https://www.w3.org/TR/filter-effects-1/#elementdef-fefunca
      version: W3C Working Draft, 18 December 2018
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
    - id: filter-effects-fe-component-transfer
      title: "Filter Effects Module Level 1: Filter primitive feComponentTransfer"
      url: https://www.w3.org/TR/filter-effects-1/#feComponentTransferElement
      version: W3C Working Draft, 18 December 2018
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - "The specification defines `<feFuncA>` as the transfer function element for the alpha component."
    - "The `<feFuncA>` section uses the same transfer function attributes defined for `<feFuncR>`."
    - "When more than one transfer function element of the same kind is specified, the last occurrence is used."

scope:
  includes:
    - "`<feFuncA>` child elements inside `<feComponentTransfer>`."
    - "The alpha channel mapping."
    - "The shared transfer function attributes already modeled for `<feFuncR>`."
    - "Last occurrence wins for repeated `<feFuncA>` children."
  excludes:
    - "`<feFuncR>`, `<feFuncG>`, and `<feFuncB>`."
    - "Applying transfer functions to pixel values."
    - "Animation elements inside `<feFuncA>`."
  assumptions:
    - Swg stores parsed transfer functions inside the enclosing `SVGFilterPrimitive.componentTransfer` value.
    - Shared transfer function attribute parsing is covered by the `<feFuncR>` requirements and tests.

terminology:
  - id: T001
    term: feFuncA
    definition: The transfer function element for the alpha component of an input graphic.
    source_refs:
      - filter-effects-fe-func-a

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: "`<feFuncA>` must store a parsed transfer function on the alpha component channel of its enclosing `<feComponentTransfer>` primitive."
    applies_to:
      - SVGComponentTransferChannel.alpha
      - SVGFilterPrimitive.componentTransfer
    source_refs:
      - filter-effects-fe-func-a
    testability: testable
    verification:
      strategy: automated-test
      tests:
        - svgParserPreservesAlphaComponentTransferFunctionAttributes
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: "When multiple `<feFuncA>` elements occur in the same `<feComponentTransfer>`, the last alpha-channel function must be used."
    applies_to:
      - SVGFilterPrimitive.componentTransfer
    source_refs:
      - filter-effects-fe-component-transfer
    testability: testable
    verification:
      strategy: automated-test
      tests:
        - svgParserPreservesAlphaComponentTransferFunctionAttributes

traceability:
  source_to_requirements:
    filter-effects-fe-func-a:
      - R001
    filter-effects-fe-component-transfer:
      - R002
  requirement_to_tests:
    R001:
      - svgParserPreservesAlphaComponentTransferFunctionAttributes
    R002:
      - svgParserPreservesAlphaComponentTransferFunctionAttributes
