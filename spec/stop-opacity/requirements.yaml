schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: stop-opacity
  title: Gradient stop opacity
  domain: SVG 2 Paint Servers
  profile: null
  summary: Preserve SVG `stop-opacity` property values for gradient stops as clamped alpha values.
  non_goals:
    - Rendering gradient interpolation or compositing.
    - The `opacity`, `fill-opacity`, or `stroke-opacity` painting properties.
    - Complete CSS math or calc() support for alpha values.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-stop-opacity-property
      title: "SVG 2 Paint Servers: stop-opacity property"
      url: https://www.w3.org/TR/SVG/pservers.html#StopOpacityProperty
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
    - id: svg2-styling-presentation-attributes
      title: "SVG 2 Styling: Presentation attributes"
      url: https://www.w3.org/TR/SVG/styling.html#PresentationAttributes
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - "`stop-opacity` defines the opacity of a gradient stop."
    - "The opacity used for gradient calculation is the product of `stop-opacity` and any opacity in the `stop-color` value."
    - "`stop-opacity` accepts `<alpha-value>`, initially 1, applies to `stop` elements, and is not inherited."
    - "Number values outside the 0 to 1 range are clamped; percentages express the same range."
    - "`stop-opacity` is listed as a presentation attribute."

scope:
  includes:
    - Parser output for `stop-opacity` on `stop` elements inside linear and radial gradients.
    - Initial stop opacity of 1.
    - Non-inheritance from parent gradient elements.
    - Number alpha values.
    - Percentage alpha values mapped to the 0...1 range.
    - Clamping parsed values outside 0...1.
    - Presentation attributes, class style rules, and inline style declarations in the package's supported cascade subset.
    - Invalid or unsupported stop-opacity declarations leaving the current cascaded or default stop opacity unchanged.
  excludes:
    - Renderer compositing and actual alpha blending.
    - CSS calc(), variables, or math functions.
    - Standalone handling of opacity embedded in future color syntaxes not yet parsed by the package.
  assumptions:
    - The parser stores the computed-enough alpha as a Double on `SVGGradientStop.opacity`.
    - Invalid values leave the current parser-visible value unchanged.

terminology:
  - id: term-stop-opacity
    term: stop-opacity
    definition: A non-inherited SVG property that selects the opacity of a gradient stop.
    source_refs:
      - svg2-stop-opacity-property
  - id: term-alpha-value
    term: alpha-value
    definition: A number or percentage alpha value where 0 is fully transparent and 1 is fully opaque.
    source_refs:
      - svg2-stop-opacity-property

structures:
  - id: S001
    name: Gradient stop opacity state
    kind: structure
    source_refs:
      - svg2-stop-opacity-property
    fields:
      - name: opacity
        type: Double
        cardinality: one
        position: null
        constraints:
          - Initial value is 1.
          - Parsed computed value is clamped to the inclusive range 0...1.
          - The property is not inherited.
        requirement_refs:
          - R001
          - R002
          - R003
          - R004
          - R005
        source_refs:
          - svg2-stop-opacity-property

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: The `stop-opacity` property must accept `<alpha-value>`.
    applies_to:
      - "`stop` elements"
    source_refs:
      - svg2-stop-opacity-property
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: A stop without a cascaded `stop-opacity` value must use 1 as the initial stop opacity.
    applies_to:
      - "`stop` elements"
    source_refs:
      - svg2-stop-opacity-property
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: "`stop-opacity` must not inherit from parent elements by default."
    applies_to:
      - "`stop` elements"
    source_refs:
      - svg2-stop-opacity-property
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: Supported `stop-opacity` values must accept both number values and percentage values.
    applies_to:
      - "`stop` elements"
    source_refs:
      - svg2-stop-opacity-property
    testability: testable
    notes:
      - Percentages express the same 0 to 1 alpha range.
  - id: R005
    normative_strength: MUST
    kind: range
    statement: Parsed `stop-opacity` values outside the 0 to 1 range must be clamped into that range.
    applies_to:
      - "`stop` elements"
    source_refs:
      - svg2-stop-opacity-property
    testability: testable
    notes: []
  - id: R006
    normative_strength: MUST
    kind: ordering
    statement: Supported `stop-opacity` declarations must participate in the parser's supported cascade subset for presentation attributes, class style rules, and inline style declarations.
    applies_to:
      - SVG presentation attributes
      - style rules
      - inline style attributes
    source_refs:
      - svg2-styling-presentation-attributes
      - svg2-stop-opacity-property
    testability: testable
    notes: []

algorithms:
  - id: ALG001
    name: Stop opacity alpha parsing
    kind: algorithm
    summary: Convert supported stop-opacity number or percentage text into a clamped alpha value.
    steps:
      - If the value is a percentage, parse the numeric component and divide by 100.
      - Otherwise parse the value as a number.
      - Clamp the numeric result to the inclusive range 0...1.
      - If parsing fails, do not replace the current parser-visible value.
    preconditions:
      - The declaration names `stop-opacity`.
    postconditions:
      - The parser-visible stop opacity is a Double in the 0...1 range.
    requirement_refs:
      - R004
      - R005
    source_refs:
      - svg2-stop-opacity-property

invalid_or_unsupported_inputs:
  - id: I001
    condition: A `stop-opacity` value is malformed or unsupported by the parser.
    source_behavior: UNSPECIFIED
    required_behavior: Leave the existing stop opacity value unchanged until the syntax is supported by a later work item.
    decision_required: false
    source_refs:
      - svg2-stop-opacity-property

recommendations: []

derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: A focused parser test for this bullet must prove initial value, non-inheritance, percentage conversion, clamping, invalid fallback, and cascade override behavior for `stop-opacity`.
    derived_from:
      - R002
      - R003
      - R004
      - R005
      - R006
    reasoning: These cases distinguish complete `stop-opacity` support from earlier number-only stop opacity parsing.
    source_refs:
      - svg2-stop-opacity-property
      - svg2-styling-presentation-attributes

implementation_choices:
  - id: IC001
    topic: Parser-visible representation
    statement: The package may expose clamped `stop-opacity` as a Double on `SVGGradientStop` without performing renderer compositing.
    allowed_by:
      - Current parser architecture
      - Renderer integration boundary
    source_refs:
      - svg2-stop-opacity-property

ambiguities: []

dependencies:
  - id: DEP001
    kind: source-section
    title: SVG presentation attributes
    reason: "`stop-opacity` is listed as a presentation attribute on SVG elements."
    source_refs:
      - svg2-styling-presentation-attributes

