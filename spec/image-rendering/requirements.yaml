schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: image-rendering
  title: Image rendering property
  domain: SVG 2 Painting
  profile: null
  summary: Preserve parser-visible `image-rendering` hint state for SVG image elements so later renderers can choose image quality or speed tradeoffs.
  non_goals:
    - Performing raster image sampling or smoothing.
    - Implementing renderer-specific image-quality tradeoffs.
    - Implementing future CSS Image Values Level 4 extensions.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-image-rendering-property
      title: "SVG 2 Painting: The image-rendering property"
      url: https://www.w3.org/TR/SVG/painting.html#ImageRenderingProperty
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
    - id: svg2-styling-presentation-attributes
      title: "SVG 2 Styling: Presentation attributes"
      url: https://www.w3.org/TR/SVG/styling.html#PresentationAttributes
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - SVG 2 defines `image-rendering` as an inherited visual property with values `auto`, `optimizeQuality`, and `optimizeSpeed`.
    - The initial value is `auto`, the computed value is as specified, and the property applies to images.
    - SVG 2 notes that CSS Image Values and Replaced Content Module Level 4 may redefine this property in the future.

scope:
  includes:
    - Parser output for the supported `image-rendering` property on SVG image elements.
    - Initial value `auto`.
    - Inheritance from parent elements.
    - Supported cascade inputs: presentation attributes, class style rules, and inline style declarations.
    - Valid keywords `auto`, `optimizeQuality`, and `optimizeSpeed`.
    - Malformed or unsupported values leaving the current inherited or default value unchanged.
  excludes:
    - Renderer behavior for raster sampling, smoothing, pixelation, speed, or quality.
    - CSS Image Values Level 4 syntax beyond SVG 2's listed values.
    - Full CSS selector support beyond the package's current supported subset.
  assumptions:
    - The package can expose the parsed value as an enum-like property on existing parser-facing paint/style attributes.
    - CSS keyword parsing may match the supported keywords case-insensitively while preserving enum meaning rather than raw spelling.

terminology:
  - id: term-image-rendering
    term: image-rendering
    definition: An inherited SVG rendering hint that tells the user agent how to balance speed and quality for images.
    source_refs:
      - svg2-image-rendering-property
  - id: term-optimize-quality
    term: optimizeQuality
    definition: A rendering hint indicating that quality should be emphasized over speed.
    source_refs:
      - svg2-image-rendering-property
  - id: term-optimize-speed
    term: optimizeSpeed
    definition: A rendering hint indicating that speed should be emphasized over quality.
    source_refs:
      - svg2-image-rendering-property

structures:
  - id: S001
    name: Image rendering parser state
    kind: structure
    source_refs:
      - svg2-image-rendering-property
    fields:
      - name: imageRendering
        type: keyword enum
        cardinality: one
        position: null
        constraints:
          - Valid values are `auto`, `optimizeQuality`, and `optimizeSpeed`.
          - Initial value is `auto`.
          - The property is inherited.
          - Invalid values leave the current inherited or default value unchanged.
        requirement_refs:
          - R001
          - R002
          - R003
          - R004
        source_refs:
          - svg2-image-rendering-property

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: "`image-rendering` values must be limited to `auto`, `optimizeQuality`, and `optimizeSpeed`."
    applies_to:
      - SVG image elements in parser output
    source_refs:
      - svg2-image-rendering-property
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: "`image-rendering` must default to `auto` when no cascaded value is supplied."
    applies_to:
      - SVG image elements in parser output
    source_refs:
      - svg2-image-rendering-property
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: "`image-rendering` must inherit from parent elements."
    applies_to:
      - SVG image elements in parser output
    source_refs:
      - svg2-image-rendering-property
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: The parser-visible value must preserve whether the author selected `auto`, `optimizeQuality`, or `optimizeSpeed`.
    applies_to:
      - SVG image elements in parser output
    source_refs:
      - svg2-image-rendering-property
    testability: testable
    notes: []
  - id: R005
    normative_strength: MUST
    kind: behavior
    statement: A supported `image-rendering` presentation attribute must map into the same parser-visible property state as a corresponding style declaration.
    applies_to:
      - SVG presentation attributes
    source_refs:
      - svg2-styling-presentation-attributes
      - svg2-image-rendering-property
    testability: testable
    notes: []

