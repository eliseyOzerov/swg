schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: stroke-miterlimit
  title: Stroke miterlimit property
  domain: SVG 2 Painting
  profile: null
  summary: Capture parser-visible handling of `stroke-miterlimit`, including initial value, inheritance, valid non-negative numbers, and invalid negative values.
  non_goals:
    - Renderer computation of miter length.
    - Renderer conversion of miter joins to bevel joins when the limit is exceeded.
    - The `miter-clip` and `arcs` line join values.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-stroke-miterlimit-property
      title: "SVG 2 Painting: Controlling line joins: the stroke-linejoin and stroke-miterlimit properties"
      url: https://www.w3.org/TR/SVG/painting.html#StrokeMiterlimitProperty
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-styling-presentation-attributes
      title: "SVG 2 Styling: Presentation attributes"
      url: https://www.w3.org/TR/SVG/styling.html#PresentationAttributes
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes:
    - SVG 2 defines `stroke-miterlimit` with value grammar `<number>`, initial value `4`, inheritance yes, percentages not applicable, and computed value as specified.
    - SVG 2 defines the value as the limit on miter, miter-clip, or arcs join extent as a multiple of `stroke-width`.
    - SVG 2 states that negative `stroke-miterlimit` values must be treated as illegal values.
    - SVG 2 explicitly notes that earlier errors for values between 0 and 1 were not well implemented; this work item treats non-negative fractional numbers as valid.
    - SVG presentation attributes participate in styling, so `stroke-miterlimit` may appear as either a property declaration or presentation attribute where supported.

scope:
  includes:
    - Parser output for the supported `stroke-miterlimit` property on SVG shapes and renderable containers.
    - Initial `stroke-miterlimit` value of `4`.
    - Explicit non-negative numeric `stroke-miterlimit` declarations and presentation attributes.
    - Inheritance from parent elements.
    - Supported cascade inputs: presentation attributes, class style rules, and inline style declarations.
    - Negative or malformed `stroke-miterlimit` values leaving the current inherited or default value unchanged.
  excludes:
    - Renderer behavior when miter length exceeds the limit.
    - Path geometry and miter length calculations.
    - Full CSS selector support beyond the package's current supported subset.
  assumptions:
    - The parser stores `stroke-miterlimit` as a numeric value in the package's existing style state.
    - Invalid property values are ignored by the parser-visible cascade for this bullet.

terminology:
  - id: term-stroke-miterlimit
    term: stroke-miterlimit
    definition: The SVG property that limits the extent of miter, miter-clip, or arcs joins as a multiple of stroke width.
    source_refs:
      - svg2-stroke-miterlimit-property

