  - id: S001
    name: Stroke miterlimit parser state
    kind: structure
    source_refs:
      - svg2-stroke-miterlimit-property
    fields:
      - name: strokeMiterLimit
        type: number
        cardinality: one
        position: null
        constraints:
          - Initial value is `4`.
          - Valid parser-visible values are non-negative numbers.
          - The property is inherited.
        requirement_refs:
          - R001
          - R002
          - R003
          - R004
        source_refs:
          - svg2-stroke-miterlimit-property

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: The `stroke-miterlimit` property must accept non-negative numbers as valid specified values.
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-stroke-miterlimit-property
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: The initial `stroke-miterlimit` value must be `4`.
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-stroke-miterlimit-property
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: "`stroke-miterlimit` must inherit from parent elements."
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-stroke-miterlimit-property
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: "The computed value for `stroke-miterlimit` must remain the specified number."
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-stroke-miterlimit-property
    testability: testable
    notes: []
  - id: R005
    normative_strength: MUST
    kind: behavior
    statement: A supported `stroke-miterlimit` presentation attribute must map into the same parser-visible property state as a corresponding style declaration.
    applies_to:
      - SVG presentation attributes
    source_refs:
      - svg2-styling-presentation-attributes
      - svg2-stroke-miterlimit-property
    testability: testable
    notes: []
  - id: R006
    normative_strength: MUST
    kind: behavior
    statement: During rendering, `stroke-miterlimit` must limit the extent of miter, miter-clip, or arcs line joins as a multiple of `stroke-width`.
    applies_to:
      - SVG stroke rendering
    source_refs:
      - svg2-stroke-miterlimit-property
    testability: reviewable
    notes:
      - This parser-focused bullet preserves the value for renderer consumption; renderer geometry coverage is outside this work item.

