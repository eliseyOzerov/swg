    decision_required: false
    source_refs:
      - svg2-stroke-miterlimit-property
  - id: I002
    condition: A `stroke-miterlimit` value is not a number.
    source_behavior: UNSPECIFIED
    required_behavior: Invalid CSS property values do not produce a valid specified value; this parser work item must leave the current inherited or default value unchanged.
    decision_required: false
    source_refs:
      - svg2-stroke-miterlimit-property

