    normative_strength: MUST
    statement: A child element without its own `stroke-miterlimit` declaration must expose the inherited numeric value from its parent.
    derived_from:
      - R003
      - R004
    reasoning: Because `stroke-miterlimit` is inherited and computed as specified, inherited parser state must preserve the numeric value.
    source_refs:
