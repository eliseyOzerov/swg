schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: desc
  title: desc element
  domain: SVG 2
  profile: null
  summary: >
    Capture SVG 2 parser-visible behavior for the desc element as
    never-rendered descriptive text that supplies a longer description for its
    parent element.
  non_goals:
    - Exposing values through platform accessibility APIs.
    - Full SVG Accessibility API Mappings description computation.
    - aria-describedby precedence and concatenation behavior.
    - Preserving markup structure inside desc text.

source_context:
  spec_map: spec/map.yaml
  map_items:
    - id: document-container-elements-desc
      title: Document and Container Elements - desc
      artifact_path: spec/desc/requirements.yaml
  canonical_sources:
    - id: svg2-struct-desc-title
      title: SVG 2 Document Structure - The desc and title elements
      url: https://www.w3.org/TR/SVG2/struct.html#DescriptionAndTitleElements
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-struct-desc
      title: SVG 2 Document Structure - The desc element
      url: https://www.w3.org/TR/SVG2/struct.html#DescElement
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative

scope:
  includes:
    - Recognizing desc as an SVG descriptive element.
    - Preserving desc text content as plain text metadata.
    - Associating each desc with its direct parent element.
    - Keeping desc out of the renderable element tree.
    - Preserving desc language metadata from lang and xml:lang.
    - Selecting the desc whose language best matches parser language preferences.
  excludes:
    - Platform accessibility API integration.
    - DOM interface conformance.
    - aria-describedby override behavior.
    - Markup-preserving desc content.
    - Complete BCP 47 language matching beyond conservative prefix handling.
  assumptions:
    - >
      A parser-oriented implementation may store desc records separately from
      the renderable SVG element tree, keyed by parent element identity.
    - >
      Plain text content is sufficient for this bullet because SVG 2 only
      requires plain text content to be exposed to assistive technologies.

terminology:
  - id: term-descriptive-element
    term: descriptive element
    definition: >
      An SVG element that provides supplementary descriptive information about
      its parent, including desc, metadata, and title.
    source_refs:
      - svg2-struct-desc-title
  - id: term-desc
    term: desc
    definition: >
      A never-rendered descriptive element that represents more detailed
      textual information for its parent element.
    source_refs:
      - svg2-struct-desc

structures:
  - id: S001
    name: detailed text description
    kind: structure
    source_refs:
      - svg2-struct-desc
    fields:
      - name: text
        type: string
        cardinality: one
        position: text-content
        constraints:
          - Desc content is text for the parent element.
          - Markup inside desc contributes plain text for this work item.
        requirement_refs:
          - R002
          - R007
        source_refs:
          - svg2-struct-desc-title
          - svg2-struct-desc
      - name: language
        type: language-tag-or-empty
        cardinality: zero-or-one
        position: inherited-or-explicit-attribute
        constraints:
          - Multiple sibling desc elements must have different languages.
          - Empty-string language is a lowest-priority match for any user.
        requirement_refs:
          - R004
          - R005
        source_refs:
          - svg2-struct-desc-title
      - name: parent
        type: svg-element-reference
        cardinality: one
        position: parent-link
        constraints:
          - Any container or graphics element can have zero or more desc children.
        requirement_refs:
          - R001
          - R003
        source_refs:
          - svg2-struct-desc-title

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: >
      Any SVG container or graphics element may have zero or more desc elements
      as children.
    applies_to:
      - desc parent elements
    source_refs:
      - svg2-struct-desc-title
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: >
      A desc element represents more detailed textual information for its parent
      element.
    applies_to:
      - desc element
    source_refs:
      - svg2-struct-desc
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST_NOT
    kind: behavior
    statement: >
      Desc elements must not be visually rendered as part of the graphics.
    applies_to:
      - desc element
    source_refs:
      - svg2-struct-desc-title
      - svg2-struct-desc
    testability: testable
    notes:
      - SVG 2 specifies that desc is never directly rendered.
  - id: R004
    normative_strength: MUST
    kind: language
    statement: >
      Multiple sibling desc elements must have different languages as defined by
      lang or xml:lang on the desc or an ancestor.
    applies_to:
      - sibling desc elements
    source_refs:
      - svg2-struct-desc-title
    testability: reviewable
    notes: []
  - id: R005
    normative_strength: MUST
    kind: selection
    statement: >
      A user agent must select the desc element whose language best matches user
      language preferences; if multiple equally valid matches exist, the first
      match should be used.
    applies_to:
      - sibling desc elements
    source_refs:
      - svg2-struct-desc-title
    testability: testable
    notes: []
  - id: R006
    normative_strength: MUST
    kind: selection
    statement: >
      If no matching desc exists, the first desc element must be selected; a
      desc with an empty-string language tag is a lowest-priority match for any
      user.
    applies_to:
      - sibling desc elements
    source_refs:
      - svg2-struct-desc-title
    testability: testable
    notes: []
  - id: R007
    normative_strength: MUST
    kind: content
    statement: >
      Only the plain text content of desc elements is required to be exposed to
      assistive technologies.
    applies_to:
      - desc content
    source_refs:
      - svg2-struct-desc-title
    testability: testable
    notes: []

invalid_or_unsupported_inputs:
  - id: I001
    condition: Empty or whitespace-only desc text.
    source_behavior: MUST_NOT
    required_behavior: null
    decision_required: true
    source_refs:
      - svg2-struct-desc-title

recommendations: []

derived_requirements: []

implementation_choices:
  - id: IC001
    topic: Description selection algorithm granularity
    statement: >
      The source requires best language matching but does not mandate a concrete
      parser-side matching algorithm for this package.
    allowed_by:
      - R005
    source_refs:
      - svg2-struct-desc-title

ambiguities:
  - id: A001
    question: >
      How should a parser-only API represent rich markup inside desc when more
      than plain text is desired?
    impact: >
      The current bullet can expose plain text, but a future accessibility or
      DOM layer may need richer content preservation.
    options:
      - Plain text only.
      - Plain text plus a retained child tree.
      - Full DOM-preserving metadata.
    source_refs:
      - svg2-struct-desc-title

dependencies:
  - id: DEP001
    kind: source-section
    title: SVG 2 Document Structure - The desc and title elements
    reason: >
      Defines shared descriptive-element parentage, rendering, language, and
      selection rules for desc.
    source_refs:
      - svg2-struct-desc-title

profile_data: {}

traceability:
  - item_id: R001
    item_type: requirement
    source_refs:
      - svg2-struct-desc-title
    map_item_refs:
      - document-container-elements-desc
  - item_id: R002
    item_type: requirement
    source_refs:
      - svg2-struct-desc
    map_item_refs:
      - document-container-elements-desc
  - item_id: R003
    item_type: requirement
    source_refs:
      - svg2-struct-desc-title
      - svg2-struct-desc
    map_item_refs:
      - document-container-elements-desc
  - item_id: R005
    item_type: requirement
    source_refs:
      - svg2-struct-desc-title
    map_item_refs:
      - document-container-elements-desc
