invalid_or_unsupported_inputs:
  - id: I001
    condition: "`diffuseConstant` is malformed or negative."
    source_behavior: UNSPECIFIED
    required_behavior: "Use the initial value `1`."
    decision_required: false
    source_refs:
      - filter-effects-fe-diffuse-lighting
  - id: I002
    condition: "`kernelUnitLength` is malformed, negative, or zero."
    source_behavior: "Non-positive values use the default value; malformed values are not specified."
    required_behavior: "Use the omitted/default state."
    decision_required: false
    source_refs:
      - filter-effects-fe-diffuse-lighting

recommendations:
  - id: N001
    normative_strength: SHOULD
    statement: "An explicit `kernelUnitLength` should be provided for resolution-independent diffuse-lighting results."
    source_refs:
      - filter-effects-fe-diffuse-lighting

