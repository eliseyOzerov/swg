schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: inheritance
  title: Styling inheritance
  domain: SVG 2 / CSS Cascading and Inheritance
  profile: null
  summary: Capture parser-visible inheritance behavior for supported SVG styling properties, distinguishing inherited properties from non-inherited per-element effects.
  non_goals:
    - The explicit `inherit` CSS-wide keyword, covered by a separate TODO bullet.
    - The `currentColor` indirect color value, covered by a separate TODO bullet.
    - Full computed-value resolution, including percentages, URL absolutization, and color computation.
    - Rendering-time effects of inherited values through group opacity, display, clipping, masking, filtering, or transforms.
    - Properties not yet represented in `SVGPaintAttributes`.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: css-cascade-defaulting
      title: "CSS Cascading and Inheritance Level 3: Defaulting"
      url: https://www.w3.org/TR/css-cascade-3/#defaulting
      version: W3C Recommendation 11 February 2021
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: css-cascade-inheritance
      title: "CSS Cascading and Inheritance Level 3: Inheritance"
      url: https://www.w3.org/TR/css-cascade-3/#inheritance
      version: W3C Recommendation 11 February 2021
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-property-index
      title: "SVG 2 Property Index"
      url: https://www.w3.org/TR/SVG/propidx.html
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-25
      normativity: informative
    - id: svg2-styling
      title: "SVG 2 Styling"
      url: https://www.w3.org/TR/SVG/styling.html
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes:
    - The CSS cascade source defines inheritance behavior generically; SVG property definitions identify which SVG properties are inherited.
    - The SVG property index is informative, but it summarizes the property definition tables used to identify inheritance for the supported properties in this parser milestone.

scope:
  includes:
    - Inheriting supported inherited paint, stroke, fill-rule, and visibility properties from parent elements.
    - Resetting supported non-inherited properties to their initial parser defaults when absent on a child.
    - Preserving child declarations, presentation attributes, class declarations, and inline style declarations as cascade inputs after the inherited baseline is established.
    - Ensuring parser attributes represent the child element's own specified values rather than copying a parent's whole style bag.
  excludes:
    - Explicit `inherit`, `initial`, `unset`, `revert`, and `all` keyword behavior.
    - CSS importance, animation origin, transition origin, and user/user-agent origin cascade rules.
    - Full selector matching and external stylesheet cascade.
    - Inheritance for text/font properties that are not yet represented in `SVGPaintAttributes`.
    - Inheritance through use-element shadow trees or flattened trees.
  assumptions:
    - The parser stores specified/computed-enough values for downstream renderers and does not model a full CSS computed style object.
    - "`SVGPaintAttributes.defaults` represents the parser's initial values for supported properties."
    - The current parser's supported class and inline style mechanisms are already tested by neighboring TODO bullets.

terminology:
  - id: term-inheritance
    term: inheritance
    definition: The defaulting mechanism by which an inherited property on an element uses the computed value of that property on its parent when the cascade supplies no value for that element.
    source_refs:
      - css-cascade-inheritance
  - id: term-inherited-property
    term: inherited property
    definition: A property whose definition table says the value is determined by inheritance when the cascade supplies no value.
    source_refs:
      - css-cascade-inheritance
      - svg2-property-index
  - id: term-initial-value
    term: initial value
    definition: The value defined in a property's definition table and used for non-inherited properties when the cascade supplies no value.
    source_refs:
      - css-cascade-defaulting

