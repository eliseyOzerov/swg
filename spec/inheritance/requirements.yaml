requirements:
  - id: R001
    normative_strength: MUST
    kind: defaulting
    statement: When the cascade does not produce a value for a property, inherited properties must draw their defaults from the parent element through inheritance, while non-inherited properties use their initial values.
    applies_to:
      - SVGParser.parsePaintAttributes
    source_refs:
      - css-cascade-defaulting
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: Inheritance must propagate an inherited property's parent computed value to the child element when the child has no cascaded value for that property.
    applies_to:
      - SVGParser.inheritedPaintAttributes
    source_refs:
      - css-cascade-inheritance
    testability: testable
    notes:
      - The parser stores a representation close enough to computed values for supported paint attributes.
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: Supported inherited SVG presentation properties must be seeded from the parent element before applying the child element's own declarations.
    applies_to:
      - SVGParser.inheritedPaintAttributes
      - SVGParser.parsePaintAttributes
    source_refs:
      - css-cascade-inheritance
      - svg2-property-index
    testability: testable
    notes:
      - Covered properties include fill, fill-opacity, fill-rule, stroke, stroke-width, stroke-linecap, stroke-linejoin, stroke-miterlimit, stroke-dasharray, stroke-dashoffset, stroke-opacity, and visibility.
  - id: R004
    normative_strength: MUST_NOT
    kind: behavior
    statement: Supported non-inherited properties must not be copied from a parent element merely because the child has no declaration for that property.
    applies_to:
      - SVGParser.inheritedPaintAttributes
      - SVGParser.parsePaintAttributes
    source_refs:
      - css-cascade-defaulting
      - svg2-property-index
      - svg2-styling
    testability: testable
    notes:
      - Covered parser fields include opacity, display, transform, vector-effect, clip-path, filter, and mask.
  - id: R005
    normative_strength: MUST
    kind: ordering
    statement: The inherited baseline must be established before applying supported presentation attributes, class style rules, and inline style declarations on the child element.
    applies_to:
      - SVGParser.parsePaintAttributes
    source_refs:
      - css-cascade-defaulting
      - svg2-styling
    testability: testable
    notes: []

algorithms:
  - id: ALG001
    name: Supported parser inheritance baseline
    kind: algorithm
    summary: Build a child style baseline from initial values plus only supported inherited properties from the parent.
    steps:
      - Start from parser initial values for all supported `SVGPaintAttributes` fields.
      - Copy supported inherited properties from the parent attributes into the baseline.
      - Leave supported non-inherited properties at parser initial values.
      - Apply the child element's own supported declarations through the existing cascade order.
    preconditions:
      - Parent parser attributes are available from the open element stack or root attributes.
      - XML and CSS declarations have already been tokenized by the parser's supported mechanisms.
    postconditions:
      - Child attributes inherit supported inherited properties only when the child has no winning declaration for those properties.
      - Child attributes do not implicitly inherit supported non-inherited properties.
    requirement_refs:
      - R001
      - R002
      - R003
      - R004
      - R005
    source_refs:
      - css-cascade-defaulting
      - css-cascade-inheritance
      - svg2-property-index

invalid_or_unsupported_inputs:
  - id: I001
    condition: A property is not yet represented by `SVGPaintAttributes`.
    source_behavior: MUST
    required_behavior: no parser-visible inheritance behavior until the property is implemented
    decision_required: false
    source_refs:
      - svg2-property-index
  - id: I002
    condition: A child explicitly uses the CSS-wide `inherit` keyword.
    source_behavior: MUST
    required_behavior: null
    decision_required: false
    source_refs:
      - css-cascade-inheritance

recommendations: []

derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: The parser must not treat `SVGPaintAttributes` as a wholly inheritable struct; it must copy only fields corresponding to inherited properties.
    derived_from:
      - R001
      - R003
      - R004
    reasoning: CSS defaulting distinguishes inherited and non-inherited properties, while the parser representation groups both kinds of properties into one struct.
    source_refs:
      - css-cascade-defaulting
      - css-cascade-inheritance
      - svg2-property-index

implementation_choices:
  - id: IC001
    topic: Computed style representation
    statement: The package may keep using `SVGPaintAttributes` as a parser-facing style representation as long as it seeds inherited and non-inherited fields according to property inheritance rules.
    allowed_by:
      - Current package architecture
    source_refs:
      - css-cascade-defaulting
  - id: IC002
    topic: Property coverage boundary
    statement: This milestone may limit inheritance enforcement to properties currently represented in `SVGPaintAttributes`; later property bullets must add their own inheritance behavior when appropriate.
    allowed_by:
      - User-directed bullet-by-bullet workflow
    source_refs:
      - svg2-property-index

ambiguities:
  - id: A001
    question: Should future renderers store both cascaded and used values for group-only visual effects?
    impact: Group opacity, display, clipping, masking, filtering, and transforms affect descendant rendering without being inherited CSS properties; parser data may eventually need separate render-context propagation.
    options:
      - Keep per-element specified attributes only.
      - Add a renderer context that combines group effects at render time.
      - Store both specified and accumulated render attributes.
    source_refs:
      - css-cascade-defaulting
      - svg2-property-index

