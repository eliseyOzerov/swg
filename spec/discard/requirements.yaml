implementation_choices:
  - id: IC001
    topic: Parser representation
    statement: The parser may store `<discard>` elements in `SVGDocument` animation data rather than as drawable `SVGElement` cases.
    allowed_by:
      - R001
      - R002
      - R007
    source_refs:
      - svg2-wd-discard-element

