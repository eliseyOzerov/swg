work_item:
  id: matrix-transform
  title: SVG matrix transform function
  domain: SVG 2 / CSS Transforms Level 1
  profile: null
  summary: The `matrix(a, b, c, d, e, f)` transform function represents a 2D affine transform using the six SVG/CSS matrix parameters.
  non_goals:
    - Transform-list ordering.
    - Individual translate, scale, rotate, or skew functions.
    - 3D transform matrices.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-coords-transform-property
      title: SVG 2, 8.5 The transform property
      url: https://www.w3.org/TR/SVG2/coords.html#TransformProperty
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: css-transforms-transform-functions
      title: CSS Transforms Module Level 1, 9 The Transform Functions
      url: https://www.w3.org/TR/css-transforms-1/#transform-functions
      version: Candidate Recommendation 14 February 2019
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: css-transforms-mathematical-description
      title: CSS Transforms Module Level 1, 14 Mathematical Description of Transform Functions
      url: https://www.w3.org/TR/css-transforms-1/#mathematical-description
      version: Candidate Recommendation 14 February 2019
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes:
    - SVG 2 requires support for the transform property and presentation attribute as defined by CSS Transforms Level 1.

scope:
  includes:
    - Parsing `matrix` transform functions with six numeric parameters.
    - Mapping the six parameters into the package's 2D affine transform representation.
    - Applying the parsed matrix to points using the SVG/CSS 2D matrix layout.
  excludes:
    - Matrix decomposition and interpolation.
    - 3D matrix functions.
  assumptions:
    - The package stores the CSS/SVG `e` and `f` translation parameters as `tx` and `ty`.

terminology:
  - id: term-2d-matrix
    term: 2D matrix
    definition: A six-parameter affine transform represented by values `a`, `b`, `c`, `d`, `e`, and `f`.
    source_refs:
      - css-transforms-mathematical-description

