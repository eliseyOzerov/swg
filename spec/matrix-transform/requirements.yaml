requirements:
  - id: R001
    normative_strength: MUST
    kind: conformance
    statement: SVG user agents must support the transform property and presentation attribute as defined by CSS Transforms Level 1.
    applies_to:
      - SVGParser.parseTransform
    source_refs:
      - svg2-coords-transform-property
    testability: reviewable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: A 2D matrix with parameters `a`, `b`, `c`, `d`, `e`, and `f` must map to the affine matrix whose x row uses `a`, `c`, and `e`, and whose y row uses `b`, `d`, and `f`.
    applies_to:
      - Transform
      - SVGParser.parseTransform
    source_refs:
      - css-transforms-mathematical-description
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: The `e` and `f` parameters of a 2D matrix must act as translation components in the local coordinate system.
    applies_to:
      - Transform
      - Point.applying
      - SVGParser.parseTransform
    source_refs:
      - css-transforms-mathematical-description
    testability: testable
    notes: []

