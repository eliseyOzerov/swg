schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: text
  title: SVG text element
  domain: SVG Text
  profile: null
  summary: Requirements for preserving an SVG text element as rendered text content with its character data and directly relevant style attributes.
  non_goals:
    - Complete glyph layout and font shaping.
    - tspan-specific behavior.
    - textPath behavior.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-text
      title: SVG 2, Text chapter, text and tspan elements
      url: https://www.w3.org/TR/SVG/text.html#TextElement
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - No repository spec/map.yaml was present; this artifact is scoped directly to the canonical W3C text chapter.

scope:
  includes:
    - Recognition of the text element as a rendered text content block element.
    - Preservation of character data inside the text element.
    - Preservation of font and painting attributes needed by downstream rendering.
  excludes:
    - Per-character list positioning.
    - Text child elements.
    - Text on a path.
    - Advanced CSS text layout.
  assumptions:
    - Parser-level conformance can preserve text content and attributes without performing glyph shaping immediately.

terminology:
  - id: term-text-content-element
    term: text content element
    definition: An SVG element that causes a text string to be rendered onto the canvas.
    source_refs:
      - svg2-text
  - id: term-text-content-block-element
    term: text content block element
    definition: A standalone text content element for a unit of text; SVG 2 defines text as the text content block element.
    source_refs:
      - svg2-text

structures:
  - id: S001
    name: text
    kind: element
    source_refs:
      - svg2-text
    fields:
      - name: characterData
        type: string
        cardinality: optional
        position: content
        constraints:
          - Character data defines glyphs to render together with relevant attributes, properties, and font data.
        requirement_refs:
          - R001
        source_refs:
          - svg2-text
      - name: attributesAndProperties
        type: attributes
        cardinality: optional
        position: attribute
        constraints:
          - Font specification and painting attributes affect rendered characters.
        requirement_refs:
          - R002
        source_refs:
          - svg2-text

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: The text element defines a graphics element consisting of text and its character data contributes glyphs to be rendered.
    applies_to:
      - text
    source_refs:
      - svg2-text
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: structure
    statement: Attributes and properties on text indicate writing, font, and painting information for rendering the characters.
    applies_to:
      - text
    source_refs:
      - svg2-text
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: Text and tspan are rendered using the same rendering methods and painting features as other graphics elements, except markers.
    applies_to:
      - text
    source_refs:
      - svg2-text
    testability: reviewable
    notes: []

algorithms: []

invalid_or_unsupported_inputs: []

recommendations: []

derived_requirements: []

implementation_choices:
  - id: IC001
    topic: Parser representation
    statement: A parser may preserve text content and rendering attributes for a later glyph layout or rendering phase.
    allowed_by:
      - R001
      - R002
    source_refs:
      - svg2-text

ambiguities: []

dependencies:
  - id: DEP001
    kind: source-section
    title: SVG text layout
    reason: Full text rendering depends on later SVG text layout algorithms.
    source_refs:
      - svg2-text

profile_data: {}

