    source_refs:
      - svg2-styling-presentation-attributes
      - svg2-fill-rule-property
    testability: testable
    notes: []

algorithms:
  - id: ALG001
    name: Nonzero inside test
    kind: algorithm
    summary: A point is inside under `nonzero` when the directional crossing count between the point and infinity is not zero.
    steps:
      - Start with a count of zero for a ray from the point to infinity.
      - Add one for each path segment crossing the ray from left to right.
      - Subtract one for each path segment crossing the ray from right to left.
      - Treat the point as outside if the final count is zero.
      - Treat the point as inside if the final count is not zero.
    preconditions:
      - The shape has path segments that can be tested against a ray.
    postconditions:
      - The result classifies the tested point as inside or outside for fill painting.
    requirement_refs:
      - R005
    source_refs:
      - svg2-fill-rule-property

invalid_or_unsupported_inputs:
  - id: I001
    condition: A `fill-rule` value is neither `nonzero` nor `evenodd`.
    source_behavior: UNSPECIFIED
    required_behavior: Invalid CSS property values do not produce a valid specified value; this parser work item must leave the current inherited or default value unchanged.
    decision_required: false
    source_refs:
      - svg2-fill-rule-property

recommendations: []

derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: A child element without its own `fill-rule` declaration must expose `nonzero` when its inherited value is `nonzero`.
    derived_from:
      - R002
      - R003
      - R004
    reasoning: Because `fill-rule` is inherited and its initial/computed `nonzero` value remains as specified, inherited parser state must preserve that value.
    source_refs:
      - svg2-fill-rule-property

implementation_choices:
  - id: IC001
    topic: Parser representation
    statement: The package may represent SVG `nonzero` with its existing `FillRule.winding` case.
    allowed_by:
      - The source defines behavior and value semantics, not programming-language enum case names.
    source_refs:
      - svg2-fill-rule-property

ambiguities:
  - id: A001
    question: Should the package eventually expose a public spelling that exactly matches SVG `nonzero` instead of `winding`?
    impact: API naming may matter for users who expect SVG terminology, but this bullet can verify behavior through the existing representation.
    options:
      - Keep `FillRule.winding` as the nonzero representation.
      - Add an alias or rename in a future API cleanup.
    source_refs:
      - svg2-fill-rule-property

