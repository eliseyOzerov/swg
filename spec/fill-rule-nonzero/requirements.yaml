schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: fill-rule-nonzero
  title: Fill rule nonzero value
  domain: SVG 2 Painting
  profile: null
  summary: Capture parser-visible handling of the `fill-rule` property when its specified or initial value is `nonzero`.
  non_goals:
    - The `fill-rule: evenodd` value, covered by a separate Painting TODO bullet.
    - Renderer hit-testing or rasterization of filled pixels.
    - Geometry boolean operations for proving point-in-shape results.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-fill-rule-property
      title: "SVG 2 Painting: Winding rule: the fill-rule property"
      url: https://www.w3.org/TR/SVG/painting.html#FillRule
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-fill-property
      title: "SVG 2 Painting: Specifying fill paint: the fill property"
      url: https://www.w3.org/TR/SVG/painting.html#SpecifyingFillPaint
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-styling-presentation-attributes
      title: "SVG 2 Styling: Presentation attributes"
      url: https://www.w3.org/TR/SVG/styling.html#PresentationAttributes
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes:
    - SVG 2 defines `fill-rule` with value grammar `nonzero | evenodd`, initial value `nonzero`, inheritance yes, and computed value as specified.
    - SVG 2 states that the `fill` operation determines the inside of a shape using the current `fill-rule`.
    - SVG presentation attributes participate in styling, so `fill-rule` may appear as either a property declaration or presentation attribute where supported.

scope:
  includes:
    - Parser output for the supported `fill-rule` property on SVG shapes and renderable containers.
    - Initial `fill-rule` value of `nonzero`.
    - Explicit `fill-rule: nonzero` declarations and presentation attributes.
    - Inheritance of `nonzero` from a parent element.
    - Supported cascade inputs: presentation attributes, class style rules, and inline style declarations.
    - Invalid `fill-rule` values leaving the current inherited or default value unchanged.
  excludes:
    - The `evenodd` winding algorithm and parser value.
    - Rendering-time point-in-path evaluation.
    - Full CSS selector support beyond the package's current supported subset.
  assumptions:
    - The parser stores `nonzero` using the package's existing non-zero winding fill rule representation.
    - Invalid property values are ignored by the parser-visible cascade for this bullet.

terminology:
  - id: term-fill-rule
    term: fill-rule
    definition: The SVG property that selects the winding rule used to determine which canvas areas are inside a shape.
    source_refs:
      - svg2-fill-rule-property
  - id: term-nonzero
    term: nonzero
    definition: The fill-rule value that treats a point as inside when crossing counts do not sum to zero.
    source_refs:
      - svg2-fill-rule-property
  - id: term-shape
    term: shape
    definition: An SVG graphical element such as a path or basic shape whose interior can be filled.
    source_refs:
      - svg2-fill-property

structures:
  - id: S001
    name: Fill rule parser state
    kind: structure
    source_refs:
      - svg2-fill-rule-property
    fields:
      - name: fillRule
        type: FillRule
        cardinality: one
        position: null
        constraints:
          - Initial value is `nonzero`.
          - Supported values include `nonzero` and `evenodd`; this work item verifies `nonzero`.
        requirement_refs:
          - R001
          - R002
          - R003
        source_refs:
          - svg2-fill-rule-property

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: The `fill-rule` property must accept `nonzero` as a valid specified value.
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-fill-rule-property
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: The initial `fill-rule` value must be `nonzero`.
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-fill-rule-property
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: "`fill-rule` must inherit from parent elements."
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-fill-rule-property
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: "The computed value for `fill-rule: nonzero` must remain `nonzero`."
    applies_to:
      - SVG shapes
      - SVG text content elements
    source_refs:
      - svg2-fill-rule-property
    testability: testable
    notes: []
  - id: R005
    normative_strength: MUST
    kind: behavior
    statement: Fill painting must use the current `fill-rule` value to decide which portions of a shape are inside.
    applies_to:
      - SVG fill painting
    source_refs:
      - svg2-fill-property
      - svg2-fill-rule-property
    testability: reviewable
    notes:
      - This parser-focused bullet preserves the rule for renderer consumption; renderer coverage is outside this work item.
  - id: R006
    normative_strength: MUST
    kind: behavior
    statement: A supported `fill-rule` presentation attribute must map into the same parser-visible property state as a corresponding style declaration.
    applies_to:
