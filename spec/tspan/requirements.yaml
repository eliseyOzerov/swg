schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: tspan
  title: SVG tspan element
  domain: SVG Text
  profile: null
  summary: Requirements for preserving tspan child text content and span-level styling inside SVG text.
  non_goals:
    - Per-character x, y, dx, dy, or rotate handling.
    - Text on a path.
    - Complete glyph layout and font shaping.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-tspan
      title: SVG 2, Text chapter, text and tspan elements
      url: https://www.w3.org/TR/SVG/text.html#TSpanElement
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - No repository spec/map.yaml was present; this artifact is scoped directly to the canonical W3C text chapter.

scope:
  includes:
    - Recognition of tspan as a text content child element inside text.
    - Preservation of character data belonging to the tspan.
    - Preservation of span-level painting attributes.
  excludes:
    - Positioning attributes covered by the separate text-positioning bullet.
    - rotate covered by the separate rotate bullet.
    - Full CSS text layout.
  assumptions:
    - Parser-level conformance can preserve tspan content as an ordered span in a later text rendering pipeline.

terminology:
  - id: term-text-content-child-element
    term: text content child element
    definition: A text content element allowed as a descendant of another text content element; SVG includes tspan and textPath.
    source_refs:
      - svg2-tspan

structures:
  - id: S001
    name: tspan
    kind: element
    source_refs:
      - svg2-tspan
    fields:
      - name: characterData
        type: string
        cardinality: optional
        position: content
        constraints:
          - Character data inside a tspan contributes glyphs to render.
        requirement_refs:
          - R001
        source_refs:
          - svg2-tspan
      - name: attributesAndProperties
        type: attributes
        cardinality: optional
        position: attribute
        constraints:
          - tspan can switch style for rendered text inside the tspan.
        requirement_refs:
          - R002
        source_refs:
          - svg2-tspan

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: The tspan element is a text content child element allowed within text content and contributes its character data to rendered text.
    applies_to:
      - tspan
    source_refs:
      - svg2-tspan
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: A tspan inside text allows style changes and position adjustments for the rendered text inside the tspan.
    applies_to:
      - tspan
    source_refs:
      - svg2-tspan
    testability: testable
    notes:
      - Position adjustments are covered by separate TODO bullets.
  - id: R003
    normative_strength: MUST
    kind: ordering
    statement: Character data from text and tspan elements participates in rendering order according to document order.
    applies_to:
      - text
      - tspan
    source_refs:
      - svg2-tspan
    testability: testable
    notes: []

algorithms: []

invalid_or_unsupported_inputs: []

recommendations: []

derived_requirements: []

implementation_choices:
  - id: IC001
    topic: Parser representation
    statement: A parser may preserve each tspan as an ordered span carrying its text and span-local rendering attributes.
    allowed_by:
      - R001
      - R002
      - R003
    source_refs:
      - svg2-tspan

ambiguities: []

dependencies:
  - id: DEP001
    kind: source-section
    title: SVG text element
    reason: tspan is useful as a child within a text content element.
    source_refs:
      - svg2-tspan

profile_data: {}

