schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: preserve-aspect-ratio-none
  title: SVG preserveAspectRatio none
  domain: SVG 2
  profile: null
  summary: The `none` alignment value disables uniform scaling and maps the viewBox bounding box exactly to the viewport rectangle.
  non_goals:
    - meet alignment.
    - slice alignment.
    - Clipping rendered output.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-coords-preserve-aspect-ratio
      title: SVG 2, 8.7 The preserveAspectRatio attribute
      url: https://www.w3.org/TR/SVG2/coords.html#PreserveAspectRatioAttribute
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-coords-equivalent-transform
      title: SVG 2, 8.2 Computing the equivalent transform of an SVG viewport
      url: https://www.w3.org/TR/SVG2/coords.html#ComputingAViewportsTransform
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes: []

scope:
  includes:
    - `preserveAspectRatio="none"` transform behavior.
    - Ignoring meetOrSlice for `none`.
  excludes:
    - Uniform scale alignment behavior.
  assumptions:
    - The package computes viewBox transforms independently from renderer output.

terminology: []
structures: []

requirements:
  - id: R001
    normative_strength: MUST
    kind: behavior
    statement: When `align` is `none`, the transform must not force uniform scaling.
    applies_to:
      - SVGPreserveAspectRatio.viewBoxTransform
    source_refs:
      - svg2-coords-preserve-aspect-ratio
      - svg2-coords-equivalent-transform
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: When `align` is `none`, the graphic content must be scaled non-uniformly as needed so the viewBox bounding box exactly matches the SVG viewport rectangle.
    applies_to:
      - SVGPreserveAspectRatio.viewBoxTransform
    source_refs:
      - svg2-coords-preserve-aspect-ratio
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: When `align` is `none`, any meetOrSlice value must be ignored.
    applies_to:
      - SVGPreserveAspectRatio
      - SVGPreserveAspectRatio.viewBoxTransform
    source_refs:
      - svg2-coords-preserve-aspect-ratio
    testability: testable
    notes: []

