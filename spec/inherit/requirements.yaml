schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: inherit
  title: Explicit inherit keyword
  domain: SVG 2 / CSS Cascading and Inheritance
  profile: null
  summary: Capture the CSS-wide `inherit` keyword behavior for supported SVG presentation and style properties parsed by swg.
  non_goals:
    - Implicit inheritance when no cascaded value exists, covered by the `inheritance` work item.
    - Other CSS-wide keywords, including `initial`, `unset`, `revert`, and `all`.
    - Full CSS cascade origin, importance, layer, specificity, animation, or transition processing.
    - Complete computed-value resolution such as URL absolutization, percentage resolution, and color computation.
    - Properties not currently represented in the parser-facing style model.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: css-cascade-inheritance
      title: "CSS Cascading and Inheritance Level 3: Inheritance"
      url: https://www.w3.org/TR/css-cascade-3/#inheritance
      version: W3C Recommendation 11 February 2021
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: css-cascade-inherit-keyword
      title: "CSS Cascading and Inheritance Level 3: Explicit Inheritance: the inherit keyword"
      url: https://www.w3.org/TR/css-cascade-3/#inherit-initial
      version: W3C Recommendation 11 February 2021
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-styling-presentation-attributes
      title: "SVG 2 Styling: Presentation attributes"
      url: https://www.w3.org/TR/SVG/styling.html#PresentationAttributes
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-property-index
      title: "SVG 2 Property Index"
      url: https://www.w3.org/TR/SVG/propidx.html
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-25
      normativity: informative
  source_notes:
    - CSS Cascade defines the behavior of the CSS-wide `inherit` keyword for all CSS properties.
    - SVG 2 presentation attributes are parsed as CSS values and participate in CSS cascading and inheritance, so the same CSS-wide keyword behavior applies to supported presentation attributes.
    - The SVG 2 property index is informative, but it is used here as a compact reference for the supported properties' inheritance flags and initial values.

scope:
  includes:
    - Explicit `inherit` values supplied through supported SVG presentation attributes.
    - Explicit `inherit` values supplied through supported class style rules.
    - Explicit `inherit` values supplied through the inline `style` attribute.
    - Supported inherited and non-inherited presentation/style properties represented in parser output.
    - Cascaded `inherit` values overriding earlier declarations from presentation attributes or style rules.
  excludes:
    - CSS shorthands and longhand expansion beyond the package's supported property names.
    - The `all` property and other CSS-wide keywords.
    - External style sheets, user style sheets, user-agent style sheets, animations, transitions, and `!important`.
    - Presentation attributes whose names are ordinary SVG attributes rather than presentation attributes for a CSS property.
  assumptions:
    - The parser stores values in a representation close enough to computed values for supported SVG properties to serve as the parent value for later children.
    - Unsupported properties are ignored until they have their own TODO bullets and tests.
    - Parent attributes used for explicit inheritance are the parent element's parser-visible values after that parent has applied its own cascade subset.

terminology:
  - id: term-inherit-keyword
    term: inherit keyword
    definition: A CSS-wide keyword that makes a property's specified and computed values equal to the inherited value.
    source_refs:
      - css-cascade-inherit-keyword
  - id: term-inherited-value
    term: inherited value
    definition: The computed value of the property on the parent element, or the property's initial value for the root element.
    source_refs:
      - css-cascade-inheritance
  - id: term-presentation-attribute
    term: presentation attribute
    definition: An SVG attribute corresponding to a CSS property that is parsed as a CSS value and participates in CSS cascading and inheritance.
    source_refs:
      - svg2-styling-presentation-attributes

