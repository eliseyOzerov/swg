requirements:
  - id: R001
    normative_strength: MUST
    kind: behavior
    statement: When a supported CSS property's cascaded value is `inherit`, the element's specified and computed value for that property must be the inherited value from its parent.
    applies_to:
      - Supported presentation attributes
      - Supported class style declarations
      - Supported inline style declarations
    source_refs:
      - css-cascade-inherit-keyword
      - css-cascade-inheritance
    testability: testable
    notes:
      - This applies regardless of whether the property normally inherits by default.
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: For supported properties that are not inherited by default, an explicit `inherit` declaration must still copy the parent's inherited value rather than using the property's initial value.
    applies_to:
      - display
      - opacity
      - vector-effect
      - transform
      - clip-path
      - filter
      - mask
    source_refs:
      - css-cascade-inherit-keyword
      - svg2-property-index
      - svg2-styling-presentation-attributes
    testability: testable
    notes:
      - The SVG property index identifies `display`, `opacity`, and `vector-effect` as non-inherited; CSS Cascade still gives `inherit` explicit inheritance behavior for all properties.
  - id: R003
    normative_strength: MUST
    kind: ordering
    statement: An `inherit` declaration must take effect at the point where that declaration wins in the supported cascade order, replacing earlier values for the same property.
    applies_to:
      - Presentation attributes
      - Class style rules
      - Inline style attribute declarations
    source_refs:
      - css-cascade-inherit-keyword
      - svg2-styling-presentation-attributes
    testability: testable
    notes:
      - In this package's current subset, inline style declarations are the latest supported author-origin declarations.
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: SVG presentation attributes corresponding to supported properties must accept `inherit` as a CSS-wide property value because presentation attributes are parsed as CSS values.
    applies_to:
      - SVG namespace presentation attributes
    source_refs:
      - svg2-styling-presentation-attributes
      - css-cascade-inherit-keyword
    testability: testable
    notes: []

algorithms:
  - id: ALG001
    name: Explicit inherit resolution
    kind: algorithm
    summary: Resolve a winning `inherit` declaration by copying the parent element's value for that same property.
    steps:
      - Determine the parent element's current parser-visible value for the property.
      - When a supported declaration's value is the CSS-wide `inherit` keyword, assign that parent value to the child property.
      - Continue later supported cascade processing so later declarations can still replace the inherited value.
    preconditions:
      - The property name is supported by the parser.
      - The declaration's value is the CSS-wide `inherit` keyword after CSS value parsing.
    postconditions:
      - The child element exposes the parent value for that property unless a later supported declaration replaces it.
    requirement_refs:
      - R001
      - R003
    source_refs:
      - css-cascade-inherit-keyword
      - css-cascade-inheritance

invalid_or_unsupported_inputs:
  - id: I001
    condition: A declaration uses `inherit` on a property not represented by the parser.
    source_behavior: MUST
    required_behavior: The CSS behavior applies in the source, but this package may ignore unsupported properties until their parser representation exists.
    decision_required: false
    source_refs:
      - css-cascade-inherit-keyword
  - id: I002
    condition: A value merely contains the substring `inherit` but is not exactly the CSS-wide keyword.
    source_behavior: UNSPECIFIED
    required_behavior: null
    decision_required: true
    source_refs:
      - css-cascade-inherit-keyword

recommendations: []

derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: A focused parser test for this bullet must demonstrate that explicit `inherit` copies parent values for both normally inherited and normally non-inherited supported properties.
    derived_from:
      - R001
      - R002
    reasoning: The CSS-wide keyword applies to all CSS properties, while the SVG property index differentiates which properties inherit by default; testing both cases prevents confusing explicit inheritance with default inheritance.
    source_refs:
      - css-cascade-inherit-keyword
      - svg2-property-index

implementation_choices:
