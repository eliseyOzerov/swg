    topic: Supported property boundary
    statement: The package may limit this bullet to properties currently represented in its parser-facing style model, provided unchecked TODO bullets remain for unsupported SVG properties.
    allowed_by:
      - Current package scope
      - User-directed bullet-by-bullet implementation workflow
    source_refs: []
  - id: IC002
    topic: CSS tokenizer depth
    statement: The package may recognize the CSS-wide keyword with its existing declaration/value parsing subset for this milestone.
    allowed_by:
      - Current parser architecture
    source_refs: []

ambiguities:
  - id: A001
    question: Should the parser eventually expose diagnostics when `inherit` appears on an unsupported property?
    impact: Diagnostics would help strict SVG validation, but the current package primarily exposes parsed supported data.
    options:
      - Continue silently ignoring unsupported properties.
      - Add a strict parsing mode with ignored-declaration diagnostics.
    source_refs: []

