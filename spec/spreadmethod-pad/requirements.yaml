schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: spreadmethod-pad
  title: Gradient spread method pad
  domain: SVG 2 Paint Servers
  profile: null
  summary: Preserve SVG `spreadMethod="pad"` and the default pad behavior on linear and radial gradients.
  non_goals:
    - Implementing `spreadMethod="reflect"` or `spreadMethod="repeat"`, covered by later TODO bullets.
    - Rendering-time gradient color extension outside the gradient vector.
    - Template inheritance through `href`.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-linear-gradient-spreadmethod
      title: "SVG 2 Paint Servers: linearGradient spreadMethod"
      url: https://www.w3.org/TR/SVG/pservers.html#LinearGradientElementSpreadMethodAttribute
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
    - id: svg2-radial-gradient-spreadmethod
      title: "SVG 2 Paint Servers: radialGradient spreadMethod"
      url: https://www.w3.org/TR/SVG/pservers.html#RadialGradientElementSpreadMethodAttribute
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - "`spreadMethod` indicates what happens if a gradient starts or ends inside the painted bounds."
    - "The allowed values are `pad`, `reflect`, and `repeat`."
    - "The initial value is `pad`."
    - "`pad` uses the terminal gradient colors to fill the remainder of the target region."
    - "Radial gradients use the same spreadMethod values and meanings as linear gradients."

scope:
  includes:
    - Parser output for explicit `spreadMethod="pad"` on linear gradients.
    - Parser output for explicit `spreadMethod="pad"` on radial gradients.
    - Omitted `spreadMethod` using the initial `pad` value.
    - Invalid or unsupported `spreadMethod` values leaving the parser-visible value at `pad`.
  excludes:
    - Renderer application of terminal colors outside the gradient vector or circles.
    - "`reflect` and `repeat` parser values."
    - "`href` inheritance of spread method values."
  assumptions:
    - The parser can expose a gradient spread-method enum for downstream renderer consumption.
    - Invalid attribute values fall back to the initial value for this parser-focused work item.

terminology:
  - id: term-spreadmethod
    term: spreadMethod
    definition: An SVG gradient attribute that controls how painting continues when the gradient vector or circles do not cover the target region.
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod
  - id: term-pad
    term: pad
    definition: The spread method that extends the terminal colors of the gradient across the remainder of the target region.
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod

structures:
  - id: S001
    name: Gradient spread method state
    kind: structure
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod
    fields:
      - name: spreadMethod
        type: enum
        cardinality: one
        position: null
        constraints:
          - Allowed values include `pad`.
          - Initial value is `pad`.
          - Applies to linear and radial gradient elements.
        requirement_refs:
          - R001
          - R002
          - R003
        source_refs:
          - svg2-linear-gradient-spreadmethod
          - svg2-radial-gradient-spreadmethod

requirements:
  - id: R001
    normative_strength: MUST
    kind: behavior
    statement: A linear gradient without a valid `spreadMethod` attribute must expose `pad` as the initial spread method.
    applies_to:
      - "`linearGradient` elements"
    source_refs:
      - svg2-linear-gradient-spreadmethod
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: A radial gradient without a valid `spreadMethod` attribute must expose `pad` as the initial spread method.
    applies_to:
      - "`radialGradient` elements"
    source_refs:
      - svg2-radial-gradient-spreadmethod
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: Explicit `spreadMethod="pad"` must be preserved on linear and radial gradient definitions.
    applies_to:
      - "`linearGradient` elements"
      - "`radialGradient` elements"
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod
    testability: testable
    notes: []

algorithms: []

invalid_or_unsupported_inputs:
  - id: I001
    condition: A `spreadMethod` value is malformed or unsupported by the parser.
    source_behavior: UNSPECIFIED
    required_behavior: Leave the parser-visible spread method at the initial `pad` value.
    decision_required: false
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod

recommendations: []

derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: A focused parser test for this bullet must prove explicit pad, default pad, and invalid fallback for both linear and radial gradients.
    derived_from:
      - R001
      - R002
      - R003
      - I001
    reasoning: These cases prove the parser-visible state needed before renderer spread behavior can be implemented.
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod

implementation_choices:
  - id: IC001
    topic: Parser-visible representation
    statement: The package may expose `pad` as an enum case on gradient definitions and defer renderer behavior to later work.
    allowed_by:
      - Current parser architecture
      - Renderer integration boundary
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod

