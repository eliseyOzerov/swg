schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: preserve-aspect-ratio-slice
  title: SVG preserveAspectRatio slice
  domain: SVG 2
  profile: null
  summary: The `slice` value preserves aspect ratio by uniformly scaling the viewBox until it covers the entire viewport, then aligning the result.
  non_goals:
    - Non-uniform `none` scaling.
    - `meet` contained-fit behavior.
    - Renderer clipping of content outside the viewport.
    - Exhaustive testing of every align keyword.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-coords-preserve-aspect-ratio
      title: SVG 2, 8.7 The preserveAspectRatio attribute
      url: https://www.w3.org/TR/SVG2/coords.html#PreserveAspectRatioAttribute
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-coords-equivalent-transform
      title: SVG 2, 8.2 Computing the equivalent transform of an SVG viewport
      url: https://www.w3.org/TR/SVG2/coords.html#ComputingAViewportsTransform
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes: []

scope:
  includes:
    - Uniform scale selection for `slice`.
    - Center and minimum-edge alignment offsets after `slice` scaling.
  excludes:
    - All align keyword permutations.
    - Clipping or drawing output after the transform is applied.
  assumptions:
    - ViewBox-to-viewport transform coverage is sufficient for this bullet until renderer clipping is implemented.

terminology: []
structures: []

requirements:
  - id: R001
    normative_strength: MUST
    kind: behavior
    statement: For `slice`, the transform must preserve the viewBox aspect ratio.
    applies_to:
      - SVGPreserveAspectRatio.viewBoxTransform
    source_refs:
      - svg2-coords-preserve-aspect-ratio
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: For `slice`, the transformed viewBox must cover the entire SVG viewport and be scaled down as much as possible while preserving aspect ratio.
    applies_to:
      - SVGPreserveAspectRatio.viewBoxTransform
    source_refs:
      - svg2-coords-preserve-aspect-ratio
      - svg2-coords-equivalent-transform
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: algorithm
    statement: For `slice` with an alignment other than `none`, the smaller of scale-x and scale-y must be set to the larger scale.
    applies_to:
      - SVGPreserveAspectRatio.viewBoxTransform
    source_refs:
      - svg2-coords-equivalent-transform
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: Alignment keywords must adjust translation so midpoints or minimum edges of the transformed viewBox align with the corresponding viewport positions.
    applies_to:
      - SVGPreserveAspectRatio.viewBoxTransform
    source_refs:
      - svg2-coords-preserve-aspect-ratio
      - svg2-coords-equivalent-transform
    testability: testable
    notes: []

