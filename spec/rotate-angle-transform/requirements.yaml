schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: rotate-angle-transform
  title: SVG rotate(angle) transform function
  domain: SVG 2 / CSS Transforms Level 1
  profile: null
  summary: The single-angle `rotate` transform function rotates local coordinates around the current origin by the specified angle.
  non_goals:
    - Three-argument `rotate(angle cx cy)`.
    - Transform-list ordering.
    - 3D rotate functions.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-coords-transform-property
      title: SVG 2, 8.5 The transform property
      url: https://www.w3.org/TR/SVG2/coords.html#TransformProperty
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: css-transforms-svg-functions
      title: CSS Transforms Module Level 1, 7.3 SVG transform functions
      url: https://www.w3.org/TR/css-transforms-1/#svg-transform-functions
      version: Candidate Recommendation 14 February 2019
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: css-transforms-mathematical-description
      title: CSS Transforms Module Level 1, 14 Mathematical Description of Transform Functions
      url: https://www.w3.org/TR/css-transforms-1/#mathematical-description
      version: Candidate Recommendation 14 February 2019
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes:
    - SVG 2 requires support for the transform property and presentation attribute as defined by CSS Transforms Level 1.

scope:
  includes:
    - Parsing single-angle `rotate` transform functions.
    - Mapping unitless SVG rotate values as degree angles.
    - Applying the resulting origin-centered 2D rotation matrix to points.
  excludes:
    - Three-argument SVG rotate syntax with an explicit center.
    - CSS transform-origin behavior.
  assumptions:
    - The package stores transform angles internally in radians.

terminology:
  - id: term-rotate-transform
    term: rotate transform
    definition: A transform function that rotates the local coordinate system by an angle around the rotation origin.
    source_refs:
      - css-transforms-svg-functions
      - css-transforms-mathematical-description

structures:
  - id: S001
    name: rotate(angle)
    kind: transform-function
    source_refs:
      - css-transforms-svg-functions
      - css-transforms-mathematical-description
    fields:
      - name: angle
        type: angle
        cardinality: required
        position: 1
        constraints:
          - Unitless SVG rotate values are interpreted as degrees.
        requirement_refs:
          - R002
          - R003
        source_refs:
          - css-transforms-svg-functions

requirements:
  - id: R001
    normative_strength: MUST
    kind: conformance
    statement: SVG user agents must support the transform property and presentation attribute as defined by CSS Transforms Level 1.
    applies_to:
      - SVGParser.parseTransform
    source_refs:
      - svg2-coords-transform-property
    testability: reviewable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: A single-angle `rotate` transform must rotate local coordinates around the current origin.
    applies_to:
      - Transform
      - Point.applying
      - SVGParser.parseTransform
    source_refs:
      - css-transforms-svg-functions
      - css-transforms-mathematical-description
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: Unitless SVG rotate angles must be interpreted as degrees.
    applies_to:
      - SVGAngleParser
      - SVGParser.parseTransform
    source_refs:
      - css-transforms-svg-functions
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: A 2D rotation by angle alpha must use a matrix equivalent to rotation about the z axis by alpha.
    applies_to:
      - Transform.rotated
      - SVGParser.parseTransform
    source_refs:
      - css-transforms-mathematical-description
    testability: testable
    notes: []

