schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: color-interpolation
  title: Color interpolation property
  domain: SVG 2 Painting
  profile: null
  summary: Preserve parser-visible `color-interpolation` property state for SVG elements so later gradients, animation, and compositing can choose the specified color space.
  non_goals:
    - Performing gradient stop interpolation.
    - Performing color animation interpolation.
    - Performing compositing or blending.
    - Implementing sRGB to linearized RGB conversion math in renderers.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-color-interpolation-property
      title: "SVG 2 Painting: Color space for interpolation: the color-interpolation property"
      url: https://www.w3.org/TR/SVG/painting.html#ColorInterpolationProperty
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
    - id: svg2-styling-presentation-attributes
      title: "SVG 2 Styling: Presentation attributes"
      url: https://www.w3.org/TR/SVG/styling.html#PresentationAttributes
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - SVG 2 defines `color-interpolation` as an inherited visual property with values `auto`, `sRGB`, and `linearRGB`.
    - The initial value is `sRGB`, and the computed value is as specified.
    - The property controls the color space for gradients, color animations, and compositing or blending, while filter effects use `color-interpolation-filters`.

scope:
  includes:
    - Parser output for the supported `color-interpolation` property on SVG elements.
    - Initial value `sRGB`.
    - Inheritance from parent elements.
    - Supported cascade inputs: presentation attributes, class style rules, and inline style declarations.
    - Valid keywords `auto`, `sRGB`, and `linearRGB`.
    - Malformed or unsupported values leaving the current inherited or default value unchanged.
  excludes:
    - Renderer behavior for gradients, color animations, compositing, blending, and filters.
    - "`color-interpolation-filters`."
    - Full CSS selector support beyond the package's current supported subset.
  assumptions:
    - The package can expose the parsed value as an enum-like property on existing parser-facing paint/style attributes.
    - Values are compared using SVG's exact keyword spellings after ordinary CSS property value parsing has selected the declaration.

terminology:
  - id: term-color-interpolation
    term: color-interpolation
    definition: An inherited SVG property that chooses the color space used for specified color interpolation and compositing operations.
    source_refs:
      - svg2-color-interpolation-property
  - id: term-srgb
    term: sRGB
    definition: The nonlinear sRGB color space option for color interpolation.
    source_refs:
      - svg2-color-interpolation-property
  - id: term-linearrgb
    term: linearRGB
    definition: The linearized RGB color space option for color interpolation.
    source_refs:
      - svg2-color-interpolation-property

structures:
  - id: S001
    name: Color interpolation parser state
    kind: structure
    source_refs:
      - svg2-color-interpolation-property
    fields:
      - name: colorInterpolation
        type: keyword enum
        cardinality: one
        position: null
        constraints:
          - Valid values are `auto`, `sRGB`, and `linearRGB`.
          - Initial value is `sRGB`.
          - The property is inherited.
          - Invalid values leave the current inherited or default value unchanged.
        requirement_refs:
          - R001
          - R002
          - R003
          - R004
        source_refs:
          - svg2-color-interpolation-property

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: "`color-interpolation` values must be limited to `auto`, `sRGB`, and `linearRGB`."
    applies_to:
      - SVG elements in parser output
    source_refs:
      - svg2-color-interpolation-property
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: "`color-interpolation` must default to `sRGB` when no cascaded value is supplied."
    applies_to:
      - SVG elements in parser output
    source_refs:
      - svg2-color-interpolation-property
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: "`color-interpolation` must inherit from parent elements."
    applies_to:
      - SVG elements in parser output
    source_refs:
      - svg2-color-interpolation-property
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: The parser-visible value must preserve whether the author selected `auto`, `sRGB`, or `linearRGB`.
    applies_to:
      - SVG elements in parser output
    source_refs:
      - svg2-color-interpolation-property
    testability: testable
    notes: []
  - id: R005
    normative_strength: MUST
    kind: behavior
    statement: A supported `color-interpolation` presentation attribute must map into the same parser-visible property state as a corresponding style declaration.
    applies_to:
      - SVG presentation attributes
    source_refs:
      - svg2-styling-presentation-attributes
      - svg2-color-interpolation-property
    testability: testable
    notes: []

