schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: spreadmethod-reflect
  title: Gradient spread method reflect
  domain: SVG 2 Paint Servers
  profile: null
  summary: Preserve SVG `spreadMethod="reflect"` on linear and radial gradients.
  non_goals:
    - Implementing `spreadMethod="repeat"`, covered by a later TODO bullet.
    - Rendering-time reflected gradient tiling.
    - Template inheritance through `href`.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-linear-gradient-spreadmethod
      title: "SVG 2 Paint Servers: linearGradient spreadMethod"
      url: https://www.w3.org/TR/SVG/pservers.html#LinearGradientElementSpreadMethodAttribute
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
    - id: svg2-radial-gradient-spreadmethod
      title: "SVG 2 Paint Servers: radialGradient spreadMethod"
      url: https://www.w3.org/TR/SVG/pservers.html#RadialGradientElementSpreadMethodAttribute
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - "`spreadMethod` indicates what happens if a gradient starts or ends inside the painted bounds."
    - "The allowed values are `pad`, `reflect`, and `repeat`."
    - "`reflect` repeats the gradient pattern by alternating start-to-end and end-to-start."
    - "Radial gradients use the same spreadMethod values and meanings as linear gradients."

scope:
  includes:
    - Parser output for explicit `spreadMethod="reflect"` on linear gradients.
    - Parser output for explicit `spreadMethod="reflect"` on radial gradients.
    - Existing default and invalid fallback behavior remaining `pad`.
  excludes:
    - Renderer application of reflected gradient tiling.
    - "`repeat` parser values."
    - "`href` inheritance of spread method values."
  assumptions:
    - The parser can expose `reflect` as a gradient spread-method enum case for downstream renderer consumption.

terminology:
  - id: term-spreadmethod
    term: spreadMethod
    definition: An SVG gradient attribute that controls how painting continues when the gradient vector or circles do not cover the target region.
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod
  - id: term-reflect
    term: reflect
    definition: The spread method that alternates the gradient pattern start-to-end and end-to-start until the target region is filled.
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod

structures:
  - id: S001
    name: Gradient spread method state
    kind: structure
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod
    fields:
      - name: spreadMethod
        type: enum
        cardinality: one
        position: null
        constraints:
          - Allowed values include `reflect`.
          - Applies to linear and radial gradient elements.
        requirement_refs:
          - R001
          - R002
        source_refs:
          - svg2-linear-gradient-spreadmethod
          - svg2-radial-gradient-spreadmethod

requirements:
  - id: R001
    normative_strength: MUST
    kind: behavior
    statement: Explicit `spreadMethod="reflect"` must be preserved on linear gradient definitions.
    applies_to:
      - "`linearGradient` elements"
    source_refs:
      - svg2-linear-gradient-spreadmethod
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: Explicit `spreadMethod="reflect"` must be preserved on radial gradient definitions.
    applies_to:
      - "`radialGradient` elements"
    source_refs:
      - svg2-radial-gradient-spreadmethod
    testability: testable
    notes: []

algorithms: []

invalid_or_unsupported_inputs: []

recommendations: []

derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: A focused parser test for this bullet must prove explicit reflect parsing for both linear and radial gradients.
    derived_from:
      - R001
      - R002
    reasoning: These cases prove the parser-visible state needed before renderer reflected-spread behavior can be implemented.
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod

implementation_choices:
  - id: IC001
    topic: Parser-visible representation
    statement: The package may expose `reflect` as an enum case on gradient definitions and defer renderer behavior to later work.
    allowed_by:
      - Current parser architecture
      - Renderer integration boundary
    source_refs:
      - svg2-linear-gradient-spreadmethod
      - svg2-radial-gradient-spreadmethod

ambiguities: []

