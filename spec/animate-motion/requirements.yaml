  - id: DEP002
    kind: work-item
    title: Animation interpolation attributes
    reason: The `values`, `keyTimes`, `keySplines`, and `calcMode` attributes determine motion animation timing and interpolation after this element is recognized.
    source_refs:
      - svg-animations-animate-motion-element

