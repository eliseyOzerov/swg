  - id: I001
    condition: Motion-path data or coordinate endpoint values are syntactically invalid.
    source_behavior: INVALID_ANIMATION_VALUE
    required_behavior: Preserve raw values and leave validation or no-effect handling to later animation processing.
    decision_required: false
    source_refs:
