requirements:
  - id: R001
    normative_strength: MUST
    kind: geometry
    statement: >
      The x geometry property applies to rect and describes the horizontal
      coordinate of the element position with initial value 0.
    applies_to:
      - rect geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: geometry
    statement: >
      The y geometry property applies to rect and describes the vertical
      coordinate of the element position with initial value 0.
    applies_to:
      - rect geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: geometry
    statement: >
      The width and height geometry properties apply to rect and size the
      rectangle.
    applies_to:
      - rect geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: geometry
    statement: >
      The cx geometry property applies to circle and ellipse and describes the
      horizontal center coordinate with initial value 0.
    applies_to:
      - circle geometry
      - ellipse geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes: []
  - id: R005
    normative_strength: MUST
    kind: geometry
    statement: >
      The cy geometry property applies to circle and ellipse and describes the
      vertical center coordinate with initial value 0.
    applies_to:
      - circle geometry
      - ellipse geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes: []
  - id: R006
    normative_strength: MUST
    kind: geometry
    statement: >
      The r geometry property applies to circle and describes its radius with
      initial value 0.
    applies_to:
      - circle geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes: []
  - id: R007
    normative_strength: MUST
    kind: geometry
    statement: >
      The rx geometry property applies to ellipse and rect, describing the
      horizontal ellipse radius or rect curve radius, with initial value auto.
    applies_to:
      - rect geometry
      - ellipse geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes: []
  - id: R008
    normative_strength: MUST
    kind: geometry
    statement: >
      The ry geometry property applies to ellipse and rect, describing the
      vertical ellipse radius or rect curve radius, with initial value auto.
    applies_to:
      - rect geometry
      - ellipse geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes: []
  - id: R009
    normative_strength: MUST
    kind: error
    statement: >
      Negative r, rx, and ry values are illegal, and negative rect width or
      height values are parsing errors that must be ignored.
    applies_to:
      - rect geometry
      - circle geometry
      - ellipse geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes: []
  - id: R010
    normative_strength: MUST
    kind: cascade
    statement: >
      Geometry properties can be specified through CSS property declarations in
      addition to their SVG presentation attribute form.
    applies_to:
      - basic shape geometry
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
    testability: testable
    notes:
      - This package milestone is limited to its existing class and inline style CSS support.

algorithms: []

invalid_or_unsupported_inputs:
  - id: I001
    condition: Negative r, rx, or ry.
    source_behavior: MUST
    required_behavior: Treat as illegal and use the omitted or auto behavior for that property.
    decision_required: false
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes
  - id: I002
    condition: Negative rect width or height.
    source_behavior: MUST
    required_behavior: Ignore as a parsing error and use the package fallback for that property.
    decision_required: false
    source_refs:
      - svg2-shapes

recommendations: []

derived_requirements:
  - id: D001
    normative_strength: MUST
    statement: >
      For this package, class and inline CSS geometry declarations must feed the
      same parsed numeric geometry stored on SVGRectData, SVGCircleData, and
      SVGEllipseData as XML geometry attributes.
    derived_from:
      - R001
      - R002
      - R003
      - R004
      - R005
      - R006
      - R007
      - R008
      - R010
    reasoning: >
      The package stores normalized shape geometry directly on parsed shape data
      types, so CSS geometry properties need to resolve before those data
      values are constructed.
    source_refs:
      - svg2-geometry-properties
      - svg2-shapes

implementation_choices:
  - id: IC001
    topic: CSS support boundary
    statement: >
      This bullet uses the package's existing CSS subset: simple class
      selectors from style elements and inline style declarations.
    allowed_by:
      - R010
    source_refs:
      - svg2-geometry-properties
  - id: IC002
    topic: Percentage basis
    statement: >
      Resolve x, cx, width, and rx percentages horizontally; y, cy, height, and
      ry percentages vertically; and r percentages against the normalized
      diagonal viewport basis.
    allowed_by:
      - R001
      - R002
      - R003
      - R004
      - R005
      - R006
      - R007
      - R008
    source_refs:
      - svg2-geometry-properties

ambiguities: []

dependencies:
