      - svg2-shapes
    fields:
      - name: x
        type: length-percentage
        cardinality: optional
        position: geometry-property
        constraints:
          - Initial value is 0.
          - Applies to rect.
          - Describes the horizontal coordinate of the element position.
        requirement_refs:
          - R001
        source_refs:
          - svg2-geometry-properties
      - name: y
        type: length-percentage
        cardinality: optional
        position: geometry-property
        constraints:
