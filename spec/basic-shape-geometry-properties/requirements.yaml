schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: basic-shape-geometry-properties
  title: Basic shape geometry properties
  domain: SVG 2
  profile: null
  summary: >
    Capture SVG 2 parser-visible behavior for geometry properties on basic
    shape elements, including CSS property sources for x, y, cx, cy, r, rx, ry,
    width, and height.
  non_goals:
    - Full CSS selector matching and stylesheet cascade.
    - Animation of geometry properties.
    - Geometry properties for svg, image, and foreignObject.
    - min-width, max-width, min-height, and max-height constraints.
    - Line endpoint properties x1, y1, x2, and y2.

source_context:
  spec_map: null
  map_items:
    - id: basic-shapes-geometry-properties
      title: Basic Shapes - geometry properties
      artifact_path: spec/basic-shape-geometry-properties/requirements.yaml
  canonical_sources:
    - id: svg2-geometry-properties
      title: SVG 2 Geometry Properties
      url: https://www.w3.org/TR/SVG2/geometry.html
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
    - id: svg2-shapes
      title: SVG 2 Basic Shapes
      url: https://www.w3.org/TR/SVG2/shapes.html
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-25
      normativity: normative
  source_notes:
    - No project-local spec map exists yet, so this artifact is scoped directly to the TODO bullet.

scope:
  includes:
    - Applying x, y, width, and height geometry properties to rect elements.
    - Applying cx, cy, and r geometry properties to circle elements.
    - Applying cx, cy, rx, and ry geometry properties to ellipse elements.
    - Resolving length-percentage values against the current SVG viewport using the established package length parser.
    - Reading geometry values from XML presentation attributes, class style rules parsed from style elements, and inline style attributes.
  excludes:
    - svg viewport geometry, which is covered by spec/svg-geometry-attributes/requirements.yaml.
    - image and foreignObject geometry.
    - Full CSS cascade, selector matching, specificity, media, inheritance, and shorthand handling.
    - Animation.
    - Line endpoint geometry properties.
  assumptions:
    - >
      The package's existing CSS surface intentionally supports class selectors
      from style elements plus inline style declarations.
    - >
      Geometry properties are not inherited, so shape geometry defaults are not
      taken from ancestor element geometry declarations.
    - >
      The package can resolve x, cx, width, and rx percentages against viewport
      width, y, cy, height, and ry percentages against viewport height, and r
      percentages against the normalized viewport diagonal.

terminology:
  - id: term-geometry-property
    term: geometry property
    definition: >
      An SVG property that describes an element's position or dimension and can
      be specified through CSS property syntax as well as SVG presentation
      attributes.
    source_refs:
      - svg2-geometry-properties
  - id: term-basic-shape
    term: basic shape
    definition: >
      An SVG graphics element defined by straight lines, curves, or both,
      including rect, circle, and ellipse for this work item.
    source_refs:
      - svg2-shapes

