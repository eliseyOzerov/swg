        source_refs:
          - svg2-geometry-properties
      - name: width
        type: length-percentage
        cardinality: optional
        position: geometry-property
        constraints:
          - Applies to rect.
          - A computed value of auto on rect is treated as 0.
          - A computed value of 0 disables rendering.
        requirement_refs:
          - R003
          - R009
        source_refs:
          - svg2-geometry-properties
          - svg2-shapes
      - name: height
        type: length-percentage
