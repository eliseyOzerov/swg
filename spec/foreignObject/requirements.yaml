schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: foreignObject
  title: SVG foreignObject element
  domain: SVG Embedded Content
  profile: null
  summary: Requirements for preserving SVG `<foreignObject>` elements as renderable embedded-content containers with geometry and child SVG content.
  non_goals:
    - Rendering arbitrary non-SVG XML languages such as XHTML or MathML.
    - Implementing CSS layout, form controls, or browser embedding behavior for foreign content.
    - Mapping requiredExtensions values to external language support.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-foreign-object
      title: SVG 2, Embedded content - foreignObject element
      url: https://www.w3.org/TR/SVG/embedded.html#ForeignObjectElement
      version: SVG 2
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - No repository spec/map.yaml was present; this artifact is scoped directly to the canonical W3C embedded content chapter.

scope:
  includes:
    - Recognition of `<foreignObject>` as a renderable SVG graphics element.
    - Preservation of the `x`, `y`, `width`, and `height` geometry rectangle.
    - Preservation of SVG-namespaced descendants that are parsed by the SVG parser.
    - Preservation of presentation attributes and unknown non-namespace attributes on the foreignObject element.
  excludes:
    - Rendering or serializing arbitrary foreign-language children.
    - Foreign content layout, intrinsic sizing, events, focus, or DOM integration.
    - User-agent support detection for non-SVG namespaces.
  assumptions:
    - Parser output can represent `foreignObject` as an SVG container and leave non-SVG child rendering to a later renderer or embedding layer.

terminology:
  - id: term-foreign-object
    term: foreignObject
    definition: An SVG element that includes elements from non-SVG namespaces inside a rectangular region of the SVG graphic.
    source_refs:
      - svg2-foreign-object

structures:
  - id: S001
    name: foreignObject
    kind: element
    source_refs:
      - svg2-foreign-object
    fields:
      - name: x
        type: length-percentage
        cardinality: optional
        position: attribute-or-geometry-property
        constraints:
          - Defines the horizontal position of the embedded content region.
        requirement_refs:
          - R002
        source_refs:
          - svg2-foreign-object
      - name: y
        type: length-percentage
        cardinality: optional
        position: attribute-or-geometry-property
        constraints:
          - Defines the vertical position of the embedded content region.
        requirement_refs:
          - R002
        source_refs:
          - svg2-foreign-object
      - name: width
        type: length-percentage
        cardinality: optional
        position: attribute-or-geometry-property
        constraints:
          - Defines the width of the embedded content region.
        requirement_refs:
          - R002
        source_refs:
          - svg2-foreign-object
      - name: height
        type: length-percentage
        cardinality: optional
        position: attribute-or-geometry-property
        constraints:
