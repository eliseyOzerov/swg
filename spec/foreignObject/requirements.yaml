        source_refs:
          - svg2-foreign-object

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: The parser must recognize `<foreignObject>` as an SVG embedded-content element that can participate in SVG rendering as a graphics element.
    applies_to:
      - foreignObject
    source_refs:
      - svg2-foreign-object
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: structure
    statement: The parser must preserve the `x`, `y`, `width`, and `height` geometry values that define the foreignObject rectangular region.
    applies_to:
      - foreignObject geometry
    source_refs:
      - svg2-foreign-object
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: The parser must allow `<foreignObject>` to contain child content and must not discard parseable SVG-namespaced descendants solely because they occur inside foreignObject.
    applies_to:
      - foreignObject children
    source_refs:
      - svg2-foreign-object
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: Included foreign graphical content is subject to SVG transforms, filters, clipping, masking, and compositing.
    applies_to:
      - foreignObject rendering
    source_refs:
      - svg2-foreign-object
    testability: reviewable
    notes:
      - Parser-level support should preserve the element and paint attributes needed by later renderers.
  - id: R005
    normative_strength: MAY
    kind: conformance
    statement: User agents are not required to invoke arbitrary external user agents to handle embedded foreign object content.
    applies_to:
      - foreign content rendering
    source_refs:
      - svg2-foreign-object
    testability: reviewable
    notes: []

algorithms: []

invalid_or_unsupported_inputs:
  - id: I001
    condition: Foreign non-SVG child content cannot be interpreted by the SVG parser.
    source_behavior: OPTIONAL
    required_behavior: Preserve the foreignObject element and any parseable SVG descendants; leave arbitrary foreign content rendering unsupported.
    decision_required: false
    source_refs:
      - svg2-foreign-object

recommendations: []

derived_requirements: []

implementation_choices:
  - id: IC001
    topic: Foreign child representation
    statement: A parser may choose not to model arbitrary non-SVG children while still preserving the foreignObject region and SVG-namespaced child fragments for later rendering decisions.
    allowed_by:
      - R003
      - R005
    source_refs:
      - svg2-foreign-object

