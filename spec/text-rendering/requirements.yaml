schema_version: 1
kind: spec-requirements
status: draft

work_item:
  id: text-rendering
  title: Text rendering property
  domain: SVG 2 Painting
  profile: null
  summary: Preserve parser-visible `text-rendering` hint state for SVG text so later renderers can choose speed, legibility, or geometric precision tradeoffs.
  non_goals:
    - Performing font hinting or text anti-aliasing.
    - Implementing renderer-specific text-quality tradeoffs.
    - Changing text layout or glyph shaping.

source_context:
  spec_map: null
  map_items: []
  canonical_sources:
    - id: svg2-text-rendering-property
      title: "SVG 2 Painting: The text-rendering property"
      url: https://www.w3.org/TR/SVG/painting.html#TextRenderingProperty
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
    - id: svg2-styling-presentation-attributes
      title: "SVG 2 Styling: Presentation attributes"
      url: https://www.w3.org/TR/SVG/styling.html#PresentationAttributes
      version: SVG 2 Editor's Draft
      publisher: W3C
      accessed: 2026-07-26
      normativity: normative
  source_notes:
    - SVG 2 defines `text-rendering` as an inherited visual property with values `auto`, `optimizeSpeed`, `optimizeLegibility`, and `geometricPrecision`.
    - The initial value is `auto`, the computed value is as specified, and the property applies to text.
    - The property is a rendering hint about tradeoffs among speed, legibility, and geometric precision.

scope:
  includes:
    - Parser output for the supported `text-rendering` property on SVG text elements.
    - Initial value `auto`.
    - Inheritance from parent elements.
    - Supported cascade inputs: presentation attributes, class style rules, and inline style declarations.
    - Valid keywords `auto`, `optimizeSpeed`, `optimizeLegibility`, and `geometricPrecision`.
    - Malformed or unsupported values leaving the current inherited or default value unchanged.
  excludes:
    - Renderer behavior for font hinting, anti-aliasing, legibility, or geometric precision.
    - Full CSS selector support beyond the package's current supported subset.
  assumptions:
    - The package can expose the parsed value as an enum-like property on existing parser-facing paint/style attributes.
    - CSS keyword parsing may match the supported keywords case-insensitively while preserving enum meaning rather than raw spelling.

terminology:
  - id: term-text-rendering
    term: text-rendering
    definition: An inherited SVG rendering hint that tells the user agent how to balance speed, legibility, and geometric precision for text.
    source_refs:
      - svg2-text-rendering-property
  - id: term-optimize-legibility
    term: optimizeLegibility
    definition: A rendering hint indicating that legibility should be emphasized over speed and geometric precision.
    source_refs:
      - svg2-text-rendering-property
  - id: term-geometric-precision
    term: geometricPrecision
    definition: A rendering hint indicating that geometric precision should be emphasized over legibility and speed.
    source_refs:
      - svg2-text-rendering-property

structures:
  - id: S001
    name: Text rendering parser state
    kind: structure
    source_refs:
      - svg2-text-rendering-property
    fields:
      - name: textRendering
        type: keyword enum
        cardinality: one
        position: null
        constraints:
          - Valid values are `auto`, `optimizeSpeed`, `optimizeLegibility`, and `geometricPrecision`.
          - Initial value is `auto`.
          - The property is inherited.
          - Invalid values leave the current inherited or default value unchanged.
        requirement_refs:
          - R001
          - R002
          - R003
          - R004
        source_refs:
          - svg2-text-rendering-property

requirements:
  - id: R001
    normative_strength: MUST
    kind: structure
    statement: "`text-rendering` values must be limited to `auto`, `optimizeSpeed`, `optimizeLegibility`, and `geometricPrecision`."
    applies_to:
      - SVG text elements in parser output
    source_refs:
      - svg2-text-rendering-property
    testability: testable
    notes: []
  - id: R002
    normative_strength: MUST
    kind: behavior
    statement: "`text-rendering` must default to `auto` when no cascaded value is supplied."
    applies_to:
      - SVG text elements in parser output
    source_refs:
      - svg2-text-rendering-property
    testability: testable
    notes: []
  - id: R003
    normative_strength: MUST
    kind: behavior
    statement: "`text-rendering` must inherit from parent elements."
    applies_to:
      - SVG text elements in parser output
    source_refs:
      - svg2-text-rendering-property
    testability: testable
    notes: []
  - id: R004
    normative_strength: MUST
    kind: behavior
    statement: The parser-visible value must preserve whether the author selected `auto`, `optimizeSpeed`, `optimizeLegibility`, or `geometricPrecision`.
    applies_to:
      - SVG text elements in parser output
    source_refs:
      - svg2-text-rendering-property
    testability: testable
    notes: []
  - id: R005
    normative_strength: MUST
    kind: behavior
    statement: A supported `text-rendering` presentation attribute must map into the same parser-visible property state as a corresponding style declaration.
    applies_to:
      - SVG presentation attributes
    source_refs:
      - svg2-styling-presentation-attributes
      - svg2-text-rendering-property
    testability: testable
    notes: []

