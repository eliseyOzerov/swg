			<path d="M0 4 H8 V8 H0 Z M2 5 H6 V7 H2 Z" clip-rule="evenodd"/>
		</clipPath>
		<clipPath id="object-left-half" clipPathUnits="objectBoundingBox">
			<rect x="0" y="0" width=".5" height="1"/>
		</clipPath>
