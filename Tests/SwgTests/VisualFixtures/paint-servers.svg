<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 12">
	<defs>
		<linearGradient id="linear" gradientUnits="userSpaceOnUse" x1="0" y1="1" x2="4" y2="1">
			<stop offset="0" stop-color="red"/>
			<stop offset="1" stop-color="blue"/>
		</linearGradient>
		<linearGradient id="repeat" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="2" y2="3" spreadMethod="repeat">
			<stop offset="0" stop-color="red"/>
			<stop offset=".5" stop-color="red"/>
			<stop offset=".5" stop-color="blue"/>
			<stop offset="1" stop-color="blue"/>
		</linearGradient>
		<linearGradient id="reflect" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="2" y2="5" spreadMethod="reflect">
			<stop offset="0" stop-color="red"/>
			<stop offset=".5" stop-color="red"/>
			<stop offset=".5" stop-color="blue"/>
			<stop offset="1" stop-color="blue"/>
		</linearGradient>
		<pattern id="checker" width="2" height="2" patternUnits="userSpaceOnUse">
			<rect x="0" y="0" width="1" height="1" fill="red"/>
			<rect x="1" y="1" width="1" height="1" fill="blue"/>
		</pattern>
	</defs>
	<rect id="background" x="0" y="0" width="8" height="12" fill="white"/>
	<rect id="linear-fill" x="0" y="0" width="4" height="2" fill="url(#linear)"/>
	<rect id="repeat-fill" x="0" y="2" width="8" height="2" fill="url(#repeat)"/>
	<rect id="reflect-fill" x="0" y="4" width="8" height="2" fill="url(#reflect)"/>
	<rect id="pattern-fill" x="0" y="8" width="4" height="4" fill="url(#checker)"/>
</svg>
