<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
	<rect width="720" height="480" fill="#f8fafc"/>
	<foreignObject x="68" y="70" width="270" height="180">
		<body xmlns="http://www.w3.org/1999/xhtml">
			<div style="box-sizing:border-box;width:270px;height:180px;border-radius:28px;background:#ffffff;border:4px solid #cbd5e1;padding:28px;font-family:Avenir Next,Helvetica,sans-serif;color:#0f172a;">
				<div style="font-weight:800;font-size:30px;">foreignObject</div>
				<div style="margin-top:16px;font-size:21px;color:#64748b;">HTML content in SVG</div>
			</div>
		</body>
	</foreignObject>
	<path id="motion" d="M92 346 C198 250 282 424 388 328 S560 242 638 340" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
	<circle cx="92" cy="346" r="18" fill="#f97316">
		<animateMotion dur="3s" repeatCount="indefinite">
			<mpath href="#motion"/>
		</animateMotion>
	</circle>
	<rect x="412" y="70" width="220" height="160" rx="34" fill="#0f172a" pointer-events="visiblePainted"/>
	<circle cx="476" cy="150" r="36" fill="#22c55e">
		<animate attributeName="r" values="28;42;28" dur="2s" repeatCount="indefinite"/>
	</circle>
	<rect x="532" y="112" width="54" height="76" rx="16" fill="#38bdf8">
		<animateTransform attributeName="transform" type="rotate" from="-8 559 150" to="8 559 150" dur="1.6s" repeatCount="indefinite"/>
	</rect>
	<script><![CDATA[console.log("swg preserves script content");]]></script>
</svg>
