<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
	<defs>
		<filter id="card-shadow" x="-25%" y="-25%" width="150%" height="150%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
			<feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22"/>
		</filter>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="6" result="blur"/>
			<feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.24 0 0 0 0 0.68 0 0 0 0 1 0 0 0 0.9 0"/>
			<feMerge>
				<feMergeNode/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
		<filter id="texture" x="0" y="0" width="100%" height="100%">
			<feTurbulence baseFrequency="0.03" numOctaves="3" seed="7" type="fractalNoise"/>
			<feComponentTransfer>
				<feFuncA type="table" tableValues="0 0.12"/>
			</feComponentTransfer>
		</filter>
	</defs>
	<rect width="720" height="480" fill="#f8fafc"/>
	<rect x="82" y="92" width="238" height="260" rx="36" fill="#ffffff" filter="url(#card-shadow)"/>
	<rect x="112" y="124" width="178" height="42" rx="21" fill="#38bdf8"/>
	<rect x="112" y="190" width="134" height="20" rx="10" fill="#cbd5e1"/>
	<rect x="112" y="232" width="166" height="20" rx="10" fill="#cbd5e1"/>
	<circle cx="500" cy="214" r="88" fill="#2563eb" filter="url(#glow)"/>
	<path d="M465 223 L492 252 L545 174" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
	<rect x="390" y="312" width="220" height="70" rx="28" fill="#0f172a" opacity="0.9"/>
	<rect x="390" y="312" width="220" height="70" rx="28" filter="url(#texture)"/>
</svg>
